<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tonninyira — Registration</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--ink:#1c1410;--card:#33261c;--sand:#f3e8d8;--gold:#f5b400;--red:#e23f25;--muted:#9c897a}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--sand);font:15px system-ui,sans-serif}.wrap{max-width:680px;margin:auto;padding:20px}.card{background:var(--card);border-radius:14px;padding:18px;margin:12px 0}h1{margin-bottom:4px}h2{color:var(--gold)}label{display:block;font-weight:700;margin:12px 0 5px}input,select{width:100%;padding:12px;border-radius:9px;border:1px solid #ffffff22;background:#2a1f19;color:var(--sand)}button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--red);color:var(--sand);font-weight:900;margin-top:18px}.muted{color:var(--muted);font-size:.85rem}.error{color:#ff8b77;font-weight:700;margin-top:10px}.ok{color:#7ad58a;font-weight:800;margin-top:10px}.hidden{display:none}</style></head><body><main class="wrap"><a class="muted" href="index.html">← Back to Tonninyira</a><h1>Tonninyira Registration</h1><p class="muted">Applications are reviewed before a stall or rider account is activated.</p>
<div class="card"><label>Application type</label><select id="type" onchange="toggleType()"><option value="vendor">Register a stall</option><option value="rider">Register as a rider</option></select></div>
<form id="form" class="card"><div id="vendorFields"><h2>Stall application</h2><label>Business name</label><input id="business_name" required><label>Owner name</label><input id="owner_name" required><label>Phone</label><input id="phone" type="tel" required><label>4-digit PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="4" required><label>Location</label><input id="location"><label>Category</label><input id="category"><label>Subcategory</label><input id="subcategory"><label>KCCA licence</label><input id="kcca_license"><label>URA TIN</label><input id="ura_tin"><label>UNBS certificate <span class="muted">(optional)</span></label><input id="unbs_cert"></div><div id="riderFields" class="hidden"><h2>Rider application</h2><label>Full name</label><input id="full_name"><label>Phone</label><input id="rider_phone" type="tel"><label>National ID</label><input id="national_id" autocomplete="off"><label>Vehicle type</label><input id="vehicle_type"><label>Plate number</label><input id="plate_number"></div><button id="submit">Submit application</button><div id="msg" class="hidden"></div></form></main><script>
const SUPABASE_URL='https://alxzmjgepftohwpqibmn.supabase.co';const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFseHptamdlcGZ0b2h3cHFpYm1uIiwiaWF0IjoxNzg1OTk4NTQ0LCJleHAiOjIxMDE1NzQ1NDR9.YvFQhCqL6spINPsyLs7lf7z5wxtnfi4U893ydWLXEaA';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);function toggleType(){const v=$('type').value==='vendor';$('vendorFields').classList.toggle('hidden',!v);$('riderFields').classList.toggle('hidden',v)}toggleType();
$('form').onsubmit=async e=>{e.preventDefault();$('msg').className='hidden';$('submit').disabled=true;const type=$('type').value;const b={type,registration_date:new Date().toISOString().slice(0,10)};if(type==='vendor'){Object.assign(b,{business_name:$('business_name').value,owner_name:$('owner_name').value,phone:$('phone').value,pin:$('pin').value,location:$('location').value,category:$('category').value,subcategory:$('subcategory').value,kcca_license:$('kcca_license').value,ura_tin:$('ura_tin').value,unbs_cert:$('unbs_cert').value})}else Object.assign(b,{full_name:$('full_name').value,phone:$('rider_phone').value,national_id:$('national_id').value,vehicle_type:$('vehicle_type').value,plate_number:$('plate_number').value});try{const {data,error}=await sb.functions.invoke('register-application',{body:b});if(error||!data?.ok)throw new Error(data?.error||error?.message);$('msg').textContent=`${data.message} Reference: ${data.id}`;$('msg').className='ok';$('form').reset();toggleType()}catch(err){$('msg').textContent=err.message||'Could not submit application.';$('msg').className='error'}finally{$('submit').disabled=false}};
</script></body></html>
