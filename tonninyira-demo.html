<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tonninyira — Three Player Demo</title><style>body{font-family:Arial,sans-serif;margin:0;background:#1c1410;color:#f3e8d8}header{padding:24px 18px;background:#2a1f19}h1{margin:0 0 6px}.wrap{max-width:850px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{flex:1;min-width:160px;padding:13px;border:1px solid #5a4637;background:#33261c;color:#f3e8d8;border-radius:12px;font-weight:800;cursor:pointer}.tab.active{background:#f5b400;color:#1c1410}.card{background:#2a1f19;border-radius:14px;padding:16px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.metric{background:#33261c;padding:12px;border-radius:10px}.metric small{display:block;color:#9c897a}.metric strong{font-size:1.2rem}.btn{padding:11px 14px;border:0;border-radius:10px;background:#e23f25;color:#f3e8d8;font-weight:800;cursor:pointer;margin-top:10px}.muted{color:#9c897a;line-height:1.5}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#4c9a5b;margin-top:8px}</style></head><body><header><div class="wrap"><h1>Tonninyira Demo</h1><div class="muted">One sample transaction moving through Customer → Vendor → Rider.</div></div></header><main class="wrap"><div class="tabs"><button class="tab active" data-role="customer">🛍 Customer</button><button class="tab" data-role="vendor">🏪 Vendor</button><button class="tab" data-role="rider">🏍 Rider</button></div><div id="app"></div></main><script>const order={id:'TN-DEMO-1001',customer:'Amina',vendor:'Mama Sarah Foods',rider:'Paul K.',item:'2 plates of chicken & chips',sale:20000,delivery:4000,status:'New',commissionRate:.05};function money(n){return'UGX '+Math.round(n).toLocaleString()}function render(role){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.role===role));const fee=order.sale*order.commissionRate;const vendorNet=order.sale-fee;const riderFee=order.delivery;const riderCut=riderFee*order.commissionRate;const riderNet=riderFee-riderCut;let html='';if(role==='customer'){html=`<section class="card"><h2>Customer: ${order.customer}</h2><p class="muted">Browsing is public. The account becomes necessary when Amina places the order.</p><div class="metric"><small>Basket</small><strong>${order.item}</strong></div><div class="grid"><div class="metric"><small>Food</small><strong>${money(order.sale)}</strong></div><div class="metric"><small>Delivery</small><strong>${money(order.delivery)}</strong></div><div class="metric"><small>Total</small><strong>${money(order.sale+order.delivery)}</strong></div></div><button class="btn" onclick="advance('Placed')">Place Demo Order</button><span class="pill">${order.status}</span></section>`}if(role==='vendor'){html=`<section class="card"><h2>Vendor: ${order.vendor}</h2><p class="muted">Receives only the vendor's part of the order and sees the 5% Tonninyira service deduction.</p><div class="metric"><small>Order</small><strong>${order.id}</strong></div><div class="grid"><div class="metric"><small>Gross sale</small><strong>${money(order.sale)}</strong></div><div class="metric"><small>Tonninyira 5%</small><strong>${money(fee)}</strong></div><div class="metric"><small>Vendor net</small><strong>${money(vendorNet)}</strong></div></div><button class="btn" onclick="advance('Ready for Pickup')">Mark Ready for Pickup</button><span class="pill">${order.status}</span></section>`}if(role==='rider'){html=`<section class="card"><h2>Rider: ${order.rider}</h2><p class="muted">The rider sees the pickup/delivery job and the delivery earnings after the 5% platform service deduction.</p><div class="metric"><small>Order</small><strong>${order.id}</strong></div><div class="grid"><div class="metric"><small>Delivery gross</small><strong>${money(riderFee)}</strong></div><div class="metric"><small>Tonninyira 5%</small><strong>${money(riderCut)}</strong></div><div class="metric"><small>Rider net</small><strong>${money(riderNet)}</strong></div></div><button class="btn" onclick="advance('Completed')">Complete Demo Delivery</button><span class="pill">${order.status}</span></section>`}document.getElementById('app').innerHTML=html}function advance(status){order.status=status;render(document.querySelector('.tab.active').dataset.role)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>render(b.dataset.role));render('customer');</script></body></html>
