<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tonninyira Admin User Guide</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin-session-fix.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Work+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--ink:#1c1410;--card:#2a1f19;--red:#e23f25;--gold:#f5b400;--sand:#f3e8d8;--muted:#9c897a;--line:rgba(243,232,216,.09)}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--sand);font:14px/1.65 'Work Sans',sans-serif}.wrap{max-width:1180px;margin:auto;padding:26px 18px 60px}.display{font-family:'Alfa Slab One'}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px}.eyebrow{font-size:10px;letter-spacing:1.6px;color:var(--gold);font-weight:800}.brand h1{margin:3px 0 0;font-size:22px}.access{font-size:11px;color:#9de1a8;text-align:right;font-weight:800}.hero{padding:30px 0 18px}.hero h2{font-size:34px;line-height:1.1;margin:0 0 8px}.hero p{color:var(--muted);max-width:820px}.content{display:grid;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px}.card h2,.card h3{margin:0 0 9px;color:var(--sand)}.card p{margin:7px 0;color:#d7c8ba}.card strong{color:#f3e8d8}.callout{border-left:4px solid var(--gold);background:rgba(245,180,0,.07);padding:13px 15px;border-radius:0 10px 10px 0;margin:14px 0}.danger{border-left-color:var(--red);background:rgba(226,63,37,.07)}.code{background:#16100d;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;color:#eadfd4}.empty{text-align:center;padding:38px;color:var(--muted)}a{color:#ffd86d;text-decoration:none}a:hover{text-decoration:underline}.guide-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.guide-btn{display:inline-block;border:1px solid rgba(245,180,0,.25);background:rgba(245,180,0,.08);color:var(--gold);padding:9px 12px;border-radius:9px;font-weight:800}.guide-btn:hover{text-decoration:none;background:rgba(245,180,0,.14)}@media(max-width:700px){.hero h2{font-size:28px}.access{display:none}}
</style>
</head>
<body>
<header><div class="wrap top"><div class="brand"><img src="assets/tonninyira-mark.svg" alt="Tonninyira"><div><div class="eyebrow">PRIVATE OPERATIONS MANUAL</div><h1 class="display">TONNINYIRA ADMIN GUIDE</h1></div></div><div class="access" id="access">Checking admin access…</div></div></header>
<main class="wrap" id="page" style="display:none"><section class="hero"><h2 class="display">Run the marketplace with discipline.</h2><p>The administrator's runbook for operating Tonninyira, reading marketplace signals and protecting the system.</p><div class="guide-actions"><a class="guide-btn" href="./admin-control-tower.html">← Control Tower</a></div></section><div id="content" class="content"><div class="card empty">Loading private guide…</div></div></main>
<script>
(async()=>{
  const access=document.getElementById('access'),page=document.getElementById('page'),content=document.getElementById('content');
  try{
    const state=await window.tnAdminState();
    if(!state.ok) throw new Error(state.error||'Administrator access could not be verified');
    access.textContent='Authorized '+(state.role==='staff'?'staff':'admin');
    const q=await window.supabaseClient?.rpc?.('admin_get_guide',{p_slug:'operations'});
    const r=q&&q.data;
    if(q?.error) throw q.error;
    const g=Array.isArray(r)?r[0]:r;
    if(!g) throw new Error('Private guide content is not configured');
    document.title=(g.title||'Tonninyira Admin User Guide')+' · Tonninyira';
    content.innerHTML='<article class="card">'+String(g.content_html||'<h2>Guide content unavailable</h2>')+'<div class="callout" style="margin-top:24px"><strong>Last updated:</strong> '+new Date(g.updated_at).toLocaleString()+'</div></article>';
    page.style.display='block';
  }catch(e){
    access.textContent='Administrator access could not be verified';
    content.innerHTML='<div class="card"><h2>Guide unavailable</h2><p>Please return to the Control Tower and make sure your administrator session is active.</p><a class="guide-btn" href="./admin-control-tower.html">Back to Control Tower</a></div>';
    page.style.display='block';
  }
})();
</script>
</body>
</html>
