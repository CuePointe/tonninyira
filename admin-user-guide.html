<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tonninyira Admin User Guide</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Work+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--ink:#1c1410;--card:#2a1f19;--red:#e23f25;--gold:#f5b400;--sand:#f3e8d8;--muted:#9c897a;--line:rgba(243,232,216,.09)}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--sand);font:14px/1.65 'Work Sans',sans-serif}.wrap{max-width:1180px;margin:auto;padding:26px 18px 60px}.display{font-family:'Alfa Slab One'}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px}.eyebrow{font-size:10px;letter-spacing:1.6px;color:var(--gold);font-weight:800}.brand h1{margin:3px 0 0;font-size:22px}.access{font-size:11px;color:#9de1a8;text-align:right;font-weight:800}.hero{padding:30px 0 18px}.hero h2{font-size:34px;line-height:1.1;margin:0 0 8px}.hero p{color:var(--muted);max-width:820px}.content{display:grid;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px}.card h2,.card h3{margin:0 0 9px;color:var(--sand)}.card p{margin:7px 0;color:#d7c8ba}.card strong{color:#f3e8d8}.callout{border-left:4px solid var(--gold);background:rgba(245,180,0,.07);padding:13px 15px;border-radius:0 10px 10px 0;margin:14px 0}.danger{border-left-color:var(--red);background:rgba(226,63,37,.07)}.code{background:#16100d;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;color:#eadfd4}.empty{text-align:center;padding:38px;color:var(--muted)}a{color:#ffd86d;text-decoration:none}a:hover{text-decoration:underline}@media(max-width:700px){.hero h2{font-size:28px}.access{display:none}}
</style>
</head>
<body>
<header><div class="wrap top"><div class="brand"><img src="assets/tonninyira-mark.svg" alt="Tonninyira"><div><div class="eyebrow">PRIVATE OPERATIONS MANUAL</div><h1 class="display">TONNINYIRA ADMIN GUIDE</h1></div></div><div class="access" id="access">Checking admin access…</div></div></header>
<main class="wrap" id="page" style="display:none"><section class="hero"><h2 class="display">Run the marketplace with discipline.</h2><p>The administrator's runbook for operating Tonninyira, reading marketplace signals and protecting the system.</p></section><div id="content" class="content"><div class="card empty">Loading private guide…</div></div></main>
<script>
const URL='https://alxzmjgepftohwpqibmn.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzIiwicmVmIjoiYWx4em1qZ2VwZnRvaHdwaWJtbiIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg1OTk4NTQ0LCJleHAiOjIxMDE1NzQ1NDZ9.YvFQhCqL6spINPsyLs7lf7z5wxtnfi4U893ydWLXEaA';
const sb=window.supabase.createClient(URL,KEY);
const escapeHtml=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
(async()=>{try{
  const {data,error}=await sb.auth.getUser();
  if(error||!data.user)throw Error('Sign in required');
  const {data:p,error:pe}=await sb.from('profiles').select('role,display_name,phone').eq('id',data.user.id).maybeSingle();
  if(pe)throw pe;
  const {data:a,error:ae}=await sb.from('admin_users').select('user_id').eq('user_id',data.user.id).maybeSingle();
  if(ae)throw ae;
  if(p?.role!=='admin'&&!a)throw Error('Admin authorization required');
  const {data:g,error:ge}=await sb.from('admin_guides').select('title,content_html,updated_at').eq('slug','operations').maybeSingle();
  if(ge)throw ge;
  if(!g)throw Error('Private guide content is not configured');
  document.title=`${g.title} · Tonninyira`;
  document.getElementById('access').textContent=`Authorized admin · ${p?.display_name||data.user.phone||'Account'}`;
  document.getElementById('content').innerHTML=`<article class="card">${g.content_html}<div class="callout" style="margin-top:24px"><strong>Last updated:</strong> ${escapeHtml(new Date(g.updated_at).toLocaleString())}</div></article>`;
  document.getElementById('page').style.display='block';
}catch(e){document.body.innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;background:#1c1410;color:#f3e8d8;font-family:'Work Sans',sans-serif;padding:20px"><div style="max-width:540px;background:#2a1f19;padding:28px;border-radius:18px;border:1px solid rgba(243,232,216,.1);text-align:center"><div style="color:#f5b400;font-weight:800;letter-spacing:1.5px">TONNINYIRA</div><h1 style="font-family:'Alfa Slab One',serif">Private admin guide</h1><p style="color:#9c897a;line-height:1.5">This manual is available only to an approved admin account.</p><a href="./" style="display:inline-block;background:#e23f25;color:#f3e8d8;padding:12px 18px;border-radius:9px;text-decoration:none;font-weight:800">Back to marketplace</a></div></div>`}
})();
</script>
</body>
</html>
