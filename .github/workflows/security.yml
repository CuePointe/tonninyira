name: Security Checks

on:
  push:
    branches: [main, security-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check customer JavaScript syntax
        run: node --check customer-app.js

      - name: Check staff page JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('support.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline support script found')
          Path('/tmp/support-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/support-inline.js

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for privileged Supabase keys
        shell: bash
        run: |
          if grep -RInE 'service_role|sb_secret_|SUPABASE_SERVICE_ROLE_KEY' --exclude-dir=.git --exclude='.github/workflows/security.yml' .; then
            echo 'Privileged Supabase credentials must never be committed.'
            exit 1
          fi

      - name: Check for obvious credential files
        shell: bash
        run: |
          if find . -type f \( -name '.env' -o -name 'secrets.json' -o -name '*.pem' -o -name '*.key' \) -not -path './.git/*' -not -path './.github/workflows/security.yml' | grep -q .; then
            echo 'Potential credential file found in repository.'
            exit 1
          fi
