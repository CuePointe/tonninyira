name: Apply Tonninyira enhancement layer

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-enhancements:
    if: ${{ !contains(github.event.head_commit.message, '[skip enhancement injector]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout enhancement branch
        uses: actions/checkout@v4
        with:
          ref: tonninyira-enhancements
          fetch-depth: 0

      - name: Inject public browsing, account transactions, wallet and visual gallery layer
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          remove_tags = [
              '<script src="account-location-enhancements.js"></script>',
              '<script src="account-role-location-enhancements.js"></script>',
              '<script src="account-first-flow-fix.js"></script>',
              '<script src="auth-gate.js"></script>',
          ]
          for tag in remove_tags:
              html = html.replace(tag + '\n', '').replace(tag, '')

          tags = [
              '<script src="enhancements.js"></script>',
              '<script src="enhancements-fix.js"></script>',
              '<script src="profile-copy-enhancements.js"></script>',
              '<script src="guest-access-flow.js"></script>',
              '<script src="partner-wallet-payouts.js"></script>',
              '<script src="signout-visible.js"></script>',
              '<script src="market-gallery-fix.js"></script>',
          ]
          marker = '</body>'
          if marker not in html:
              raise SystemExit('Could not find </body> in index.html')
          for tag in tags:
              if tag not in html:
                  html = html.replace(marker, f'{tag}\n{marker}', 1)
          index.write_text(html, encoding='utf-8')

          for page in ('vendor-dashboard.html', 'rider-dashboard.html'):
              p = Path(page)
              if not p.exists():
                  continue
              h = p.read_text(encoding='utf-8')
              for tag in ('<script src="partner-dashboard-auth-earnings.js"></script>', '<script src="partner-wallet-payouts.js"></script>', '<script src="signout-visible.js"></script>'):
                  if tag not in h:
                      if marker not in h:
                          raise SystemExit(f'Could not find </body> in {page}')
                      h = h.replace(marker, f'{tag}\n{marker}', 1)
              p.write_text(h, encoding='utf-8')

          print('Public browsing + account-gated transactions + wallet/payouts + sign-out + visual gallery present')

      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html vendor-dashboard.html rider-dashboard.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add partner withdrawals, sign-out and visible market slides [skip enhancement injector]'
          git push origin HEAD:tonninyira-enhancements
