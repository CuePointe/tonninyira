name: Apply Tonninyira enhancement layer

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-enhancements:
    if: ${{ !contains(github.event.head_commit.message, '[skip enhancement injector]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout enhancement branch
        uses: actions/checkout@v4
        with:
          ref: tonninyira-enhancements
          fetch-depth: 0

      - name: Inject enhancement scripts without changing page structure
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          tags = [
              '<script src="enhancements.js"></script>',
              '<script src="enhancements-fix.js"></script>',
              '<script src="profile-copy-enhancements.js"></script>',
              '<script src="account-location-enhancements.js"></script>',
              '<script src="account-role-location-enhancements.js"></script>',
              '<script src="account-first-flow-fix.js"></script>',
              '<script src="auth-gate.js"></script>',
          ]
          marker = '</body>'
          if marker not in html:
              raise SystemExit('Could not find </body> in index.html')
          for tag in tags:
              if tag not in html:
                  html = html.replace(marker, f'{tag}\n{marker}', 1)
          index.write_text(html, encoding='utf-8')

          for page in ('vendor-dashboard.html', 'rider-dashboard.html'):
              p = Path(page)
              if not p.exists():
                  continue
              h = p.read_text(encoding='utf-8')
              tag = '<script src="partner-dashboard-auth-earnings.js"></script>'
              if tag not in h:
                  if marker not in h:
                      raise SystemExit(f'Could not find </body> in {page}')
                  h = h.replace(marker, f'{tag}\n{marker}', 1)
                  p.write_text(h, encoding='utf-8')

          print('Enhancement scripts present')

      - name: Commit enhancement injection
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html vendor-dashboard.html rider-dashboard.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Make account authentication the mandatory app entry point [skip enhancement injector]'
          git push origin HEAD:tonninyira-enhancements
