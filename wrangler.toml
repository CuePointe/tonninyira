name = "tonninyira"
type = "javascript"
account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"
workers_dev = true
route = ""
zone_id = ""

[env.production]
name = "tonninyira-prod"
routes = [
  { pattern = "tonninyira.pages.dev", zone_name = "pages.dev" }
]

[build]
command = ""
cwd = "./"
watch_paths = ["src/**/*.js"]

[build.upload]
format = "service-worker"

[build.upload.rules]
type = "CompiledContentType"
globs = ["**/*.js", "**/*.css", "**/*.html"]
fallthrough = true

[env.production.build.upload.rules]
type = "CompiledContentType"
globs = ["**/*.js", "**/*.css", "**/*.html"]
fallthrough = true

# Environment variables
[env.production.vars]
SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
SUPABASE_ANON_KEY = "YOUR_ANON_KEY"
ENVIRONMENT = "production"

# Development environment
[env.development.vars]
SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
SUPABASE_ANON_KEY = "YOUR_ANON_KEY"
ENVIRONMENT = "development"

# Triggers and routes (optional)
[triggers.crons]
crons = []
