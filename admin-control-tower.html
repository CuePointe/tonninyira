<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tonninyira Admin Control Tower</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Work+Sans:wght@400;500;600;700;800&display=swap"><style>
:root{--ink:#1c1410;--card:#2a1f19;--card2:#33261c;--red:#e23f25;--gold:#f5b400;--green:#4c9a5b;--sand:#f3e8d8;--muted:#9c897a;--line:rgba(243,232,216,.09)}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--sand);font:14px 'Work Sans',sans-serif}.display{font-family:'Alfa Slab One'}.hidden{display:none!important}header{position:sticky;top:0;z-index:20;background:rgba(28,20,16,.97);border-bottom:1px solid var(--line);padding:12px 16px}.top{max-width:1400px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px;height:44px}.eyebrow{font-size:10px;letter-spacing:1.5px;color:var(--gold);font-weight:800}.brand h1{margin:3px 0 0;font-size:18px}.session{text-align:right;color:var(--muted);font-size:12px}.signout{margin-top:5px;background:transparent;border:1px solid rgba(226,63,37,.4);color:#ffb0a5;border-radius:8px;padding:6px 9px;font-weight:800}.layout{max-width:1400px;margin:auto;display:grid;grid-template-columns:220px 1fr;gap:14px;padding:14px}.side{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;height:max-content;position:sticky;top:78px}.nav{width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:11px;border-radius:9px;font-weight:800;cursor:pointer}.nav.active,.nav:hover{background:var(--card2);color:var(--sand)}.main{min-width:0}.head{display:flex;justify-content:space-between;gap:10px;align-items:end;margin-bottom:12px}.head h2{margin:0;font-size:22px}.head p{margin:4px 0 0;color:var(--muted);font-size:12px}.refresh{background:rgba(245,180,0,.08);border:1px solid rgba(245,180,0,.25);color:var(--gold);padding:9px 11px;border-radius:9px;font-weight:800;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px}.card small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px;font-weight:800}.card strong{display:block;font-size:20px;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;overflow:auto}.panel h3{margin:0 0 8px;font-size:13px}.bar{display:grid;gap:7px}.br{display:grid;grid-template-columns:100px 1fr 45px;gap:8px;align-items:center;font-size:11px}.track{height:8px;background:var(--card2);border-radius:20px;overflow:hidden}.track i{display:block;height:100%;background:var(--gold)}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:11px;vertical-align:top}th{color:var(--gold);font-size:9px;text-transform:uppercase;background:var(--card2)}.pill{border-radius:99px;padding:3px 7px;background:var(--card2);color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase}.ok{color:#9de1a8;background:rgba(76,154,91,.14)}.warn{color:#ffd86d;background:rgba(245,180,0,.12)}.bad{color:#ff9d8e;background:rgba(226,63,37,.12)}.empty{padding:30px;color:var(--muted);text-align:center}.err{padding:13px;border:1px solid rgba(226,63,37,.25);background:rgba(226,63,37,.08);border-radius:11px;color:#ffb0a5;font-weight:700}@media(max-width:1000px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:5px}.nav{width:auto;white-space:nowrap}.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:560px){.cards{grid-template-columns:repeat(2,1fr)}.session{display:none}.layout{padding:10px}}
</style></head><body><header><div class="top"><div class="brand"><img src="assets/tonninyira-mark.svg" alt="Tonninyira"><div><div class="eyebrow">ADMIN CONTROL TOWER</div><h1 class="display">TONNINYIRA</h1></div></div><div class="session"><div id="who">Checking access…</div><button class="signout" id="signout">Sign out</button></div></div></header><div class="layout"><aside class="side" id="nav"></aside><main class="main"><div class="head"><div><h2 class="display" id="title">Command centre</h2><p id="subtitle">Marketplace health across customers, supply, operations, finance and growth.</p></div><button class="refresh" id="refresh">Refresh</button></div><div id="app"></div></main></div><script>
const URL='https://alxzmjgepftohwpqibmn.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFseHptamdlcGZ0b2h3cHFpYm1uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5OTg1NDQsImV4cCI6MjEwMTU3NDU0NH0.YvFQhCqL6spINPsyLs7lf7z5wxtnfi4U893ydWLXEaA';const sb=window.supabase.createClient(URL,KEY);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=x=>new Intl.NumberFormat('en-UG').format(Math.round(Number(x||0)))+' UGX';const P=x=>{x=String(x||'—');const k=x.toLowerCase(),c=['approved','paid','completed','ready','success'].includes(k)?'ok':['pending','new','requested','processing','accepted','preparing'].includes(k)?'warn':['failed','cancelled','rejected'].includes(k)?'bad':'';return `<span class="pill ${c}">${esc(x)}</span>`};
const S=[['Overview','overview'],['Operations','operations'],['Customers','customers'],['Vendors & riders','partners'],['Payments & payouts','finance'],['Support','support'],['Approvals & trust','trust'],['Growth & analytics','growth'],['System data','system']];let current='overview';document.getElementById('nav').innerHTML=S.map(([l,i])=>`<button class="nav ${i===current?'active':''}" data-view="${i}">${l}</button>`).join('');document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{current=b.dataset.view;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===b));load(current)});
async function auth(){const {data,error}=await sb.auth.getUser();if(error||!data.user)throw Error('Sign in required');const {data:p}=await sb.from('profiles').select('role,display_name,phone').eq('id',data.user.id).maybeSingle();const {data:a}=await sb.from('admin_users').select('user_id').eq('user_id',data.user.id).maybeSingle();if(!['admin','staff'].includes(p?.role)&&!a)throw Error('This account is not authorized for the admin console.');document.getElementById('who').textContent=`${p?.display_name||data.user.phone||data.user.email||'Admin'} · ${p?.role||'admin'}`;}
async function rows(t,cols='*',limit=500){const r=await sb.from(t).select(cols).order('created_at',{ascending:false}).limit(limit);if(r.error)throw r.error;return r.data||[]}
function T(rs,cs){if(!rs.length)return '<div class="empty">No records.</div>';return `<table><thead><tr>${cs.map(c=>`<th>${c.l}</th>`).join('')}</tr></thead><tbody>${rs.map(r=>`<tr>${cs.map(c=>`<td>${c.f?c.f(r):esc(r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function set(title,sub,html){document.getElementById('title').textContent=title;document.getElementById('subtitle').textContent=sub;document.getElementById('app').innerHTML=html}
async function overview(){const [o,p,v,r,pay,po,e]=await Promise.all([rows('orders'),rows('profiles','id,role,created_at'),rows('vendors'),rows('riders'),rows('payment_transactions'),rows('partner_payouts'),rows('market_events')]);const gmv=o.reduce((a,x)=>a+Number(x.total||0),0),fees=o.reduce((a,x)=>a+Number(x.platform_fee||0)+Number(x.rider_platform_fee||0),0),done=o.filter(x=>String(x.status).toLowerCase()==='completed').length;const areas={};o.forEach(x=>{const a=x.customer_area||x.delivery_area||'Unknown';areas[a]=(areas[a]||0)+1});const top=Object.entries(areas).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=Math.max(1,...top.map(x=>x[1]));set('Command centre','Executive view of marketplace demand, supply, operations and economics.',`<div class="cards">${[['GMV',money(gmv)],['Platform fees',money(fees)],['Orders',o.length],['Completed',done],['Customers',p.filter(x=>x.role==='customer').length],['Events',e.length]].map(x=>`<div class="card"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div><div class="grid"><div class="panel"><h3>Demand geography</h3><div class="bar">${top.length?top.map(([a,n])=>`<div class="br"><span>${esc(a)}</span><div class="track"><i style="width:${n/mx*100}%"></i></div><b>${n}</b></div>`).join(''):'<div class="empty">No geography yet.</div>'}</div></div><div class="panel"><h3>Partner health</h3>${T([{m:'Vendors pending',n:v.filter(x=>x.approval_status==='pending').length},{m:'Riders pending',n:r.filter(x=>x.approval_status==='pending').length},{m:'Payout requests',n:po.filter(x=>x.status==='requested').length},{m:'Payment records',n:pay.length}],[{l:'Metric',k:'m'},{l:'Value',k:'n'}])}</div></div>`)}
async function operations(){const o=await rows('orders');set('Operations','Every order, payment state, fulfilment status and rider assignment.',T(o,[{l:'Order',k:'order_id'},{l:'Customer',k:'customer_name'},{l:'Vendor',k:'vendor_name'},{l:'Area',f:r=>esc(r.customer_area||r.delivery_area)},{l:'Total',f:r=>money(r.total)},{l:'Payment',f:r=>P(r.payment_status)},{l:'Status',f:r=>P(r.status)},{l:'Rider',k:'rider_tid'},{l:'Created',f:r=>new Date(r.created_at).toLocaleString()}]))}
async function customers(){const [p,o,w,l]=await Promise.all([rows('profiles','id,role,display_name,phone,created_at'),rows('orders','user_id,total,created_at'),rows('wishlists'),rows('loyalty_accounts')]);const cnt={};o.forEach(x=>{if(x.user_id)cnt[x.user_id]=(cnt[x.user_id]||0)+1});set('Customers','Customer growth, order frequency, saved intent and loyalty.',T(p.filter(x=>x.role==='customer'),[{l:'Name',k:'display_name'},{l:'Phone',k:'phone'},{l:'Orders',f:r=>cnt[r.id]||0},{l:'Wishlist',f:r=>w.filter(x=>x.user_id===r.id).length},{l:'Points',f:r=>l.find(x=>x.user_id===r.id)?.points||0},{l:'Joined',f:r=>new Date(r.created_at).toLocaleDateString()}]))}
async function partners(){const [v,r,po]=await Promise.all([rows('vendors'),rows('riders'),rows('partner_payouts')]);set('Vendors & riders','Supply-side onboarding, approval, capacity and partner cash-out.',`<div class="panel"><h3>Vendors</h3>${T(v,[{l:'Business',k:'business_name'},{l:'TID',k:'tonninyira_id'},{l:'Location',k:'location'},{l:'Category',k:'category'},{l:'Approval',f:r=>P(r.approval_status)},{l:'Owner',k:'owner_name'},{l:'Phone',k:'phone'},{l:'Rating',k:'rating'}])}</div><div class="panel" style="margin-top:10px"><h3>Riders</h3>${T(r,[{l:'Name',k:'full_name'},{l:'TID',k:'tonninyira_id'},{l:'Vehicle',k:'vehicle_type'},{l:'Plate',k:'plate_number'},{l:'Approval',f:r=>P(r.approval_status)},{l:'Rating',k:'rating'}])}</div><div class="panel" style="margin-top:10px"><h3>Payout queue</h3>${T(po,[{l:'Type',k:'partner_type'},{l:'Amount',f:r=>money(r.amount)},{l:'Method',k:'method'},{l:'Status',f:r=>P(r.status)},{l:'Requested',f:r=>new Date(r.requested_at).toLocaleString()},{l:'Reference',k:'reference'}])}</div>`)}
async function finance(){const [p,s,o]=await Promise.all([rows('payment_transactions'),rows('platform_settlements'),rows('orders','order_id,total,platform_fee,rider_platform_fee')]);set('Payments & payouts','Payment reconciliation, settlements and money flowing to partners.',`<div class="panel"><h3>Payment transactions</h3>${T(p,[{l:'Order',k:'order_id'},{l:'Provider',k:'provider'},{l:'Network',k:'network'},{l:'Amount',f:r=>money(r.amount)},{l:'Status',f:r=>P(r.status)},{l:'TX ref',k:'tx_ref'},{l:'Verified',f:r=>r.verified_at?new Date(r.verified_at).toLocaleString():'—'}])}</div><div class="panel" style="margin-top:10px"><h3>Platform settlements</h3>${T(s,[{l:'Vendor',k:'vendor_id'},{l:'Rider',k:'rider_tid'},{l:'Gross',f:r=>money(r.gross_amount)},{l:'Platform fee',f:r=>money(r.platform_fee)},{l:'Vendor net',f:r=>money(r.vendor_amount)},{l:'Rider net',f:r=>money(r.rider_amount)},{l:'Status',f:r=>P(r.status)}])}</div>`)}
async function support(){const [c,m]=await Promise.all([rows('support_conversations'),rows('support_messages')]);set('Support inbox','Customer service workload and conversation visibility.',`<div class="panel"><h3>Conversations</h3>${T(c,[{l:'ID',k:'id'},{l:'Customer',k:'customer_id'},{l:'Status',f:r=>P(r.status)},{l:'Messages',f:r=>m.filter(x=>x.conversation_id===r.id).length},{l:'Updated',f:r=>new Date(r.updated_at||r.created_at).toLocaleString()}])}</div><div class="panel" style="margin-top:10px"><h3>Recent messages</h3>${T(m.slice(0,250),[{l:'Conversation',k:'conversation_id'},{l:'Sender',k:'sender_user_id'},{l:'Message',k:'body'},{l:'Time',f:r=>new Date(r.created_at).toLocaleString()}])}</div>`)}
async function trust(){const [rr,re,w,v,r]=await Promise.all([rows('role_requests'),rows('reviews'),rows('wishlists'),rows('vendors'),rows('riders')]);set('Approvals & trust','Onboarding decisions, reviews, customer intent and supply trust.',`<div class="grid"><div class="panel"><h3>Role requests</h3>${T(rr,[{l:'User',k:'user_id'},{l:'Role',k:'requested_role'},{l:'Status',f:r=>P(r.status)},{l:'Created',f:r=>new Date(r.created_at).toLocaleString()}])}</div><div class="panel"><h3>Reviews</h3>${T(re,[{l:'Target',f:r=>esc(r.target_type+' · '+r.target_id)},{l:'Rating',k:'rating'},{l:'Reviewer',k:'reviewer_name'},{l:'Comment',k:'comment'}])}</div></div><div class="panel" style="margin-top:10px"><h3>Trust / supply snapshot</h3>${T([{m:'Wishlist saves',n:w.length},{m:'Saved vendors',n:new Set(w.map(x=>x.vendor_id)).size},{m:'Pending vendors',n:v.filter(x=>x.approval_status==='pending').length},{m:'Pending riders',n:r.filter(x=>x.approval_status==='pending').length}],[{l:'Signal',k:'m'},{l:'Value',k:'n'}])}</div>`)}
async function growth(){const [e,o,w,re]=await Promise.all([rows('market_events'),rows('orders','user_id,total,created_at'),rows('wishlists'),rows('reviews')]);const mix={};e.forEach(x=>mix[x.event_type]=(mix[x.event_type]||0)+1);const top=Object.entries(mix).sort((a,b)=>b[1]-a[1]).slice(0,10),mx=Math.max(1,...top.map(x=>x[1]));const u={};o.forEach(x=>{if(x.user_id)u[x.user_id]=(u[x.user_id]||0)+1});const repeat=Object.values(u).filter(n=>n>1).length;const saved={};w.forEach(x=>saved[x.item_name]=(saved[x.item_name]||0)+1);const st=Object.entries(saved).sort((a,b)=>b[1]-a[1]).slice(0,8);set('Growth & analytics','Turn marketplace behaviour into decisions on acquisition, retention, geography and supply.',`<div class="grid"><div class="panel"><h3>Behaviour event mix</h3><div class="bar">${top.length?top.map(([a,n])=>`<div class="br"><span>${esc(a)}</span><div class="track"><i style="width:${n/mx*100}%"></i></div><b>${n}</b></div>`).join(''):'<div class="empty">No event data.</div>'}</div></div><div class="panel"><h3>Retention indicators</h3>${T([{m:'Ordering users',n:Object.keys(u).length},{m:'Repeat users',n:repeat},{m:'Reviews',n:re.length},{m:'Wishlist saves',n:w.length}],[{l:'Metric',k:'m'},{l:'Value',k:'n'}])}</div></div><div class="panel" style="margin-top:10px"><h3>Most-saved products / stalls</h3>${st.length?T(st.map(x=>({a:x[0],n:x[1]})),[{l:'Name',k:'a'},{l:'Saves',k:'n'}]):'<div class="empty">No wishlist signal.</div>'}</div>`)}
async function system(){const ts=['profiles','vendors','riders','orders','reviews','wishlists','role_requests','support_conversations','support_messages','payment_transactions','partner_payouts','platform_settlements','loyalty_accounts','loyalty_transactions','market_events','order_events','notifications'];const out=[];for(const t of ts){const {count,error}=await sb.from(t).select('*',{count:'exact',head:true});out.push({t,n:error?'—':count||0})}set('System data','Administrative inventory of the marketplace data model.',T(out,[{l:'Table',k:'t'},{l:'Rows',k:'n'}]))}
async function load(v){document.getElementById('app').innerHTML='<div class="empty">Loading…</div>';try{await ({overview,operations,customers,partners,finance,support,trust,growth,system}[v])()}catch(e){document.getElementById('app').innerHTML=`<div class="err">${esc(e.message||'Could not load data.')}</div>`}}document.getElementById('refresh').onclick=()=>load(current);document.getElementById('signout').onclick=async()=>{await sb.auth.signOut({scope:'local'});location.href='./'};(async()=>{try{await auth();await load('overview')}catch(e){document.body.innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;background:#1c1410;color:#f3e8d8;font-family:'Work Sans',sans-serif;padding:20px"><div style="max-width:520px;background:#2a1f19;padding:26px;border-radius:18px;border:1px solid rgba(243,232,216,.1);text-align:center"><div style="color:#f5b400;font-weight:800;letter-spacing:1.5px;font-size:11px">TONNINYIRA</div><h1 class="display" style="font-size:23px">Admin access required</h1><p style="color:#9c897a;line-height:1.5">Sign in with an approved staff or admin account to access the control tower.</p><a href="./" style="display:inline-block;background:#e23f25;color:#f3e8d8;padding:12px 18px;border-radius:9px;text-decoration:none;font-weight:800">Back to marketplace</a></div></div>`}})();</script><script src="admin-guide-entry.js"></script>
<script src="admin-signout-fix.js"></script>
<script src="admin-session-fix.js"></script>
</body></html>
