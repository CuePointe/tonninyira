<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tonninyira Support Inbox</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#17110e;--card:#241914;--card2:#302119;--line:#49352a;--text:#f7eadb;--muted:#aa9586;--gold:#f4b51b;--red:#e64a2e;--green:#55ad69}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:15px;border-bottom:1px solid var(--line)}.grid{display:grid;grid-template-columns:330px 1fr;gap:14px;margin-top:14px}.panel,.row{background:var(--card);border:1px solid var(--line);border-radius:14px}.panel{padding:14px}.row{padding:11px;margin-bottom:8px}.list{max-height:70vh;overflow:auto}.row.active{border-color:var(--gold)}button{cursor:pointer;border:0;border-radius:10px;padding:10px 12px;font-weight:800}.primary{background:var(--red);color:#fff}.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}input,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px}textarea{min-height:70px}.messages{height:55vh;overflow:auto;padding:4px}.me{border-left:3px solid var(--gold)}.them{border-left:3px solid var(--green)}.muted{color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.list{max-height:32vh}.messages{height:45vh}}</style></head><body><main class="wrap"><div class="bar"><div><div style="font-size:24px;font-weight:900">TONNINYIRA SUPPORT</div><div class="muted" id="status">Checking staff access…</div></div><button id="signout" class="ghost">Sign out</button></div><div class="grid"><section class="panel"><h3>Open conversations</h3><div id="conversationList" class="list"></div></section><section class="panel"><div id="conversationHead" class="muted">Select a conversation</div><div id="messages" class="messages"></div><div style="display:flex;gap:8px;margin-top:8px"><input id="reply" maxlength="2000" placeholder="Reply as Tonninyira support"><button id="send" class="primary">Send</button></div><div style="display:flex;gap:8px;margin-top:8px"><button id="closeConversation" class="ghost">Close conversation</button><button id="refresh" class="ghost">Refresh</button></div></section></div></main><script>const URL='https://alxzmjgepftohwpqibmn.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFseHptamdlcGZ0b3dwcWli bW4iLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4NTk5ODU0NCwiZXhwIjoyMTAxNTc0NTQ0fQ.YvFQhCqL6spINPsyLs7lf7z5wxtnfi4U893ydWLXEaA'.replace(' ','');const sb=supabase.createClient(URL,KEY);let session=null,current=null,channel=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function boot(){session=(await sb.auth.getSession()).data.session;if(!session){$('status').textContent='Sign in is required.';return}let p=(await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle()).data;if(!['staff','admin'].includes(p?.role)){let a=(await sb.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle()).data;if(!a){$('status').textContent='Access denied: staff only.';return}}$('status').textContent='Staff access granted';await loadConversations();}async function loadConversations(){let r=await sb.from('support_conversations').select('id,customer_id,status,created_at,updated_at').eq('status','open').order('updated_at',{ascending:false});$('conversationList').innerHTML=(r.data||[]).map(c=>`<button class="row ${current?.id===c.id?'active':''}" style="display:block;width:100%;text-align:left;color:inherit" onclick="selectConversation('${c.id}')"><b>Customer</b><div class="muted">${esc(c.customer_id)}</div><div class="muted">Updated ${new Date(c.updated_at).toLocaleString()}</div></button>`).join('')||'<div class="muted">No open conversations.</div>';}async function selectConversation(id){let r=await sb.from('support_conversations').select('id,customer_id,status').eq('id',id).single();if(r.error)return alert(r.error.message);current=r.data;$('conversationHead').textContent='Conversation · '+current.customer_id;await loadMessages();if(channel)sb.removeChannel(channel);channel=sb.channel('support:'+id,{config:{private:true}}).on('postgres_changes',{event:'INSERT',schema:'public',table:'support_messages',filter:'conversation_id=eq.'+id},loadMessages).subscribe();await loadConversations();}async function loadMessages(){if(!current)return;let r=await sb.from('support_messages').select('sender_user_id,body,created_at').eq('conversation_id',current.id).order('created_at');$('messages').innerHTML=(r.data||[]).map(m=>`<div class="row ${m.sender_user_id===session.user.id?'me':'them'}"><b>${m.sender_user_id===session.user.id?'You':'Customer'}</b><div>${esc(m.body)}</div><div class="muted" style="font-size:11px">${new Date(m.created_at).toLocaleString()}</div></div>`).join('')||'<div class="muted">No messages.</div>';}async function send(){if(!current)return;let body=$('reply').value.trim();if(!body)return;let r=await sb.from('support_messages').insert({conversation_id:current.id,sender_user_id:session.user.id,body});if(r.error)alert(r.error.message);else{$('reply').value='';loadMessages();}}async function closeCurrent(){if(!current)return;let r=await sb.from('support_conversations').update({status:'closed'}).eq('id',current.id);if(r.error)alert(r.error.message);else{current=null;$('messages').innerHTML='';$('conversationHead').textContent='Select a conversation';loadConversations();}}$('send').onclick=send;$('refresh').onclick=loadConversations;$('closeConversation').onclick=closeCurrent;$('signout').onclick=async()=>{await sb.auth.signOut();location.reload()};window.selectConversation=selectConversation;window.addEventListener('DOMContentLoaded',boot);</script></body></html>
