<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tonninyira — Local Vendors. Real Prices. Your Door.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Work+Sans:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1C1410; --card:#2A1F19; --card2:#33261C;
    --red:#E23F25; --red-dark:#B92E18;
    --gold:#F5B400; --gold-dark:#C98F00;
    --green:#4C9A5B;
    --sand:#F3E8D8; --muted:#9C897A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--ink); color:var(--sand);
    font-family:'Work Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:84px;
  }
  .display{font-family:'Alfa Slab One',cursive;}
  .hidden{display:none !important;}
  svg.icon{width:20px;height:20px;flex-shrink:0;}

  header{
    background:var(--ink);
    position:sticky; top:0; z-index:40;
    border-bottom:1px solid rgba(243,232,216,0.08);
    padding:14px 16px 12px;
  }
  .brand-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .brand-lockup{display:flex; align-items:center; gap:10px;}
  .brand-badge{width:42px;height:42px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-name{font-size:1.4rem; letter-spacing:0.5px; color:var(--sand); line-height:1;}
  .brand-tag{font-size:0.62rem; letter-spacing:1.5px; color:var(--gold); font-weight:700; margin-top:3px;}
  .icon-btn{
    position:relative; width:44px; height:44px; border-radius:12px;
    background:var(--card); border:none; color:var(--sand);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn:active{background:var(--card2);}
  .badge{
    position:absolute; top:-6px; right:-6px; background:var(--red); color:var(--sand);
    font-size:0.65rem; font-weight:800; min-width:19px; height:19px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; padding:0 3px;
  }
  .location-row{
    margin-top:12px; display:flex; align-items:center; gap:8px;
    background:var(--card); border-radius:12px; padding:9px 12px;
  }
  .location-row select{
    flex:1; background:transparent; border:none; color:var(--sand); font-family:'Work Sans'; font-weight:600; font-size:0.9rem;
  }
  .location-row select:focus{outline:none;}
  .location-row option{background:var(--card); color:var(--sand);}

  .search-row{margin-top:12px; position:relative;}
  .search-row input{
    width:100%; padding:12px 14px 12px 42px; border-radius:12px; border:1px solid rgba(243,232,216,0.12);
    background:var(--card); color:var(--sand); font-family:'Work Sans'; font-size:0.95rem; font-weight:500;
  }
  .search-row input::placeholder{color:var(--muted);}
  .search-row input:focus{outline:none; border-color:var(--gold);}
  .search-row svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted);}

  .cat-tabs{display:flex; gap:8px; padding:14px 16px 0;}
  .cat-tab{
    flex:1; padding:13px 10px; border-radius:14px; border:none; cursor:pointer;
    font-family:'Alfa Slab One'; font-size:1rem; letter-spacing:0.5px;
    background:var(--card); color:var(--muted); text-align:center; transition:all .15s ease;
  }
  .cat-tab.active{background:var(--red); color:var(--sand);}

  .subcat-row{display:flex; gap:8px; overflow-x:auto; padding:12px 16px 4px; scrollbar-width:none;}
  .subcat-row::-webkit-scrollbar{display:none;}
  .subcat-chip{
    flex-shrink:0; padding:8px 16px; border-radius:999px; border:1.5px solid var(--card2);
    background:transparent; color:var(--sand); font-weight:700; font-size:0.82rem; cursor:pointer; white-space:nowrap;
  }
  .subcat-chip.active{background:var(--gold); border-color:var(--gold); color:var(--ink);}

  .popular-wrap{padding:16px 16px 4px;}
  .popular-label{font-size:0.72rem; font-weight:800; letter-spacing:1.5px; color:var(--gold); margin-bottom:8px;}
  .popular-scroll{display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; padding-bottom:4px;}
  .popular-scroll::-webkit-scrollbar{display:none;}
  .pop-chip{
    flex-shrink:0; width:112px; background:var(--card); border-radius:14px; padding:10px; cursor:pointer;
    text-align:center; border:1px solid rgba(243,232,216,0.06);
  }
  .pop-chip .avatar{width:40px;height:40px; margin:0 auto 6px;}
  .pop-chip .name{font-size:0.72rem; font-weight:700; line-height:1.2; color:var(--sand); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pop-chip .rating{font-size:0.68rem; color:var(--gold); font-weight:700; margin-top:2px;}

  .stall-list{padding:16px;}
  .stall-card{
    background:var(--card); border-radius:18px; margin-bottom:18px; overflow:hidden;
    border:1px solid rgba(243,232,216,0.06);
  }
  .stall-roof{
    height:10px;
    background:repeating-linear-gradient(45deg, var(--red) 0 10px, var(--gold) 10px 20px);
  }
  .stall-header{display:flex; gap:12px; align-items:flex-start; padding:14px 16px 10px;}
  .avatar{
    width:52px; height:52px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Alfa Slab One'; font-size:1.05rem; color:var(--ink);
    object-fit:cover;
  }
  .stall-eyebrow{font-size:0.64rem; font-weight:800; letter-spacing:1px; color:var(--gold); margin-bottom:2px;}
  .stall-name{font-weight:800; font-size:1.05rem; color:var(--sand); line-height:1.25;}
  .stall-meta{display:flex; align-items:center; flex-wrap:wrap; gap:5px; font-size:0.78rem; color:var(--muted); margin-top:4px; font-weight:600;}
  .stall-meta svg{width:13px;height:13px;}
  .stall-meta .star{color:var(--gold);}
  .verify-row{display:flex; align-items:center; flex-wrap:wrap; gap:4px; font-size:0.68rem; color:var(--green); font-weight:700; margin-top:6px;}
  .verify-row svg{width:12px;height:12px;}

  .gallery-strip{display:flex; gap:8px; overflow-x:auto; padding:2px 16px 14px; scrollbar-width:none;}
  .gallery-strip::-webkit-scrollbar{display:none;}
  .gallery-item{flex-shrink:0; width:118px;}
  .gallery-item img, .gallery-item video{width:118px; height:88px; object-fit:cover; border-radius:10px; display:block; background:var(--card2);}
  .gallery-caption{font-size:0.66rem; color:var(--muted); margin-top:4px; line-height:1.25;}

  .item-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:12px 16px; border-top:1px solid rgba(243,232,216,0.06);
  }
  .item-name{font-weight:700; font-size:0.96rem; color:var(--sand);}
  .item-desc{font-size:0.78rem; color:var(--muted); margin-top:2px;}
  .item-action{display:flex; align-items:center; gap:10px; flex-shrink:0;}

  .price-tag{
    font-family:'Caveat',cursive; font-weight:700; font-size:1.35rem; color:var(--ink);
    background:var(--gold); padding:2px 13px 5px; border-radius:3px 13px 3px 13px;
    position:relative; box-shadow:1px 3px 4px rgba(0,0,0,0.35); display:inline-block;
  }
  .price-tag::before{
    content:''; position:absolute; top:-4px; left:9px; width:6px; height:6px;
    border-radius:50%; background:var(--ink); border:1px solid var(--muted);
  }
  .item-row:nth-child(odd) .price-tag{transform:rotate(-3deg);}
  .item-row:nth-child(even) .price-tag{transform:rotate(2deg);}

  .add-btn{
    width:34px; height:34px; border-radius:50%; border:none; background:var(--red); color:var(--sand);
    font-size:1.3rem; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .add-btn:active{background:var(--red-dark);}
  .qty-btn{
    width:28px; height:28px; border-radius:50%; border:1.5px solid var(--gold); background:transparent; color:var(--gold);
    font-size:1.05rem; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1;
  }

  .placeholder{text-align:center; padding:70px 24px; color:var(--muted);}
  .placeholder svg{width:56px;height:56px; margin:0 auto 14px; opacity:0.6;}
  .placeholder h3{color:var(--sand); font-size:1.15rem; margin:0 0 6px;}

  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    background:var(--card); border-top:1px solid rgba(243,232,216,0.08);
    display:flex; padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-btn{
    flex:1; background:none; border:none; color:var(--muted); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; position:relative;
  }
  .nav-btn.active{color:var(--gold);}
  .nav-btn span{font-size:0.66rem; font-weight:700;}
  .nav-cart-badge{
    position:absolute; top:0; right:22%; background:var(--red); color:var(--sand);
    font-size:0.6rem; font-weight:800; min-width:16px; height:16px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:50;}
  .sheet{
    position:fixed; inset:0; z-index:51; display:flex; flex-direction:column;
    background:var(--ink);
  }
  .sheet-header{
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 16px; border-bottom:1px solid rgba(243,232,216,0.08);
  }
  .sheet-header h2{font-family:'Alfa Slab One'; font-size:1.2rem; margin:0; letter-spacing:0.5px;}
  .close-x{background:none; border:none; color:var(--sand); font-size:1.6rem; cursor:pointer; line-height:1;}
  .sheet-body{flex:1; overflow-y:auto; padding:16px;}

  .delivery-note{
    display:flex; gap:12px; background:var(--card); border:1px solid rgba(245,180,0,0.25);
    border-radius:14px; padding:14px; margin-bottom:16px;
  }
  .delivery-note svg{width:26px;height:26px; color:var(--gold); flex-shrink:0; margin-top:2px;}
  .delivery-note p{margin:0; font-size:0.85rem; line-height:1.4;}
  .delivery-note .dn-title{font-weight:800; color:var(--sand); margin-bottom:3px;}
  .delivery-note .dn-body{color:var(--muted);}

  .cart-line-card{
    background:var(--card); border-radius:14px; padding:13px; margin-bottom:10px;
    border-left:4px solid var(--red);
  }
  .cart-line-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .cart-line-vendor{font-size:0.72rem; color:var(--muted); font-weight:600; margin-top:2px;}

  .summary-box{background:var(--card); border-radius:14px; padding:16px; margin-top:6px;}
  .summary-row{display:flex; justify-content:space-between; font-size:0.92rem; font-weight:600; padding:6px 0;}
  .summary-row.total{border-top:1px solid rgba(243,232,216,0.12); margin-top:6px; padding-top:12px; font-size:1.05rem; font-weight:800; color:var(--gold);}

  .btn-primary{
    width:100%; padding:16px; border-radius:14px; border:none; background:var(--red); color:var(--sand);
    font-family:'Alfa Slab One'; font-size:1.02rem; letter-spacing:0.3px; cursor:pointer; margin-top:14px;
  }
  .btn-secondary{
    width:100%; padding:13px; border-radius:14px; border:1.5px solid var(--card2); background:transparent; color:var(--sand);
    font-weight:700; font-size:0.92rem; cursor:pointer; margin-top:10px;
  }
  .btn-link-alt{
    width:100%; background:none; border:none; color:var(--gold); font-weight:700; font-size:0.85rem;
    text-decoration:underline; padding:10px; cursor:pointer;
  }

  .pay-option{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    background:var(--card2); border:1px solid rgba(243,232,216,0.08); border-radius:14px;
    padding:14px; margin-bottom:10px; cursor:pointer;
  }
  .pay-option .pay-icon{width:40px;height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .pay-option .pay-name{font-weight:800; font-size:0.95rem; color:var(--sand);}
  .pay-option .pay-sub{font-size:0.74rem; color:var(--muted); margin-top:2px;}

  .empty-state{text-align:center; padding:50px 20px; color:var(--muted);}
  .empty-state svg{width:52px;height:52px; margin:0 auto 12px; opacity:0.5;}

  .confirm-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; text-align:center;}
  .confirm-check{width:88px; height:88px; border-radius:50%; background:var(--green); display:flex; align-items:center; justify-content:center; margin-bottom:18px;}
  .confirm-check svg{width:46px;height:46px; color:var(--sand);}
  .order-id-box{background:var(--card); border-radius:14px; padding:16px; width:100%; margin:18px 0;}
  .rider-card{display:flex; align-items:center; gap:12px; background:var(--card); border-radius:14px; padding:14px; width:100%; margin-top:14px;}
  .verify-check svg{width:14px;height:14px; color:var(--green); vertical-align:-2px;}
</style>
</head>
<body>

<header>
  <div class="brand-row">
    <div class="brand-lockup">
      <div class="brand-badge" id="brandBadge"></div>
      <div>
        <div class="brand-name display">TONNINYIRA</div>
        <div class="brand-tag">LOCAL VENDORS · REAL PRICES · YOUR DOOR</div>
      </div>
    </div>
    <button class="icon-btn" id="cartIconBtn" aria-label="Cart">
      <span id="cartIconSvg"></span>
      <span class="badge hidden" id="cartCount">0</span>
    </button>
  </div>

  <div class="location-row">
    <span id="pinIconSvg"></span>
    <select id="areaSelect">
      <option>Kisugu</option><option>Kansanga</option><option>Ggaba</option>
      <option>Namwongo</option><option>Entebbe</option><option>Kasangati</option><option>Jinja</option>
    </select>
  </div>

  <div class="search-row">
    <span id="searchIconSvg"></span>
    <input type="text" id="searchInput" placeholder="Search vendors or items...">
  </div>
</header>

<div id="catTabs" class="cat-tabs"></div>
<div id="subcatRow" class="subcat-row"></div>
<div id="popularWrap" class="popular-wrap"></div>
<main id="mainArea"></main>

<nav class="bottom-nav">
  <button class="nav-btn active" id="navHome" onclick="goView('shop')"><span id="navHomeIcon"></span><span>Home</span></button>
  <button class="nav-btn" id="navOrders" onclick="goView('orders')"><span id="navOrdersIcon"></span><span>Orders</span></button>
  <button class="nav-btn" onclick="openCart()">
    <span id="navCartIcon"></span><span>Cart</span>
    <span class="nav-cart-badge hidden" id="navCartBadge">0</span>
  </button>
  <button class="nav-btn" id="navProfile" onclick="goView('profile')"><span id="navProfileIcon"></span><span>Profile</span></button>
</nav>

<div id="cartOverlay" class="overlay hidden" onclick="closeCart()"></div>
<div id="cartSheet" class="sheet hidden">
  <div class="sheet-header"><h2>Your Basket</h2><button class="close-x" onclick="closeCart()">&times;</button></div>
  <div class="sheet-body" id="cartBody"></div>
</div>

<div id="confirmOverlay" class="overlay hidden"></div>
<div id="confirmSheet" class="sheet hidden">
  <div class="confirm-wrap">
    <div class="confirm-check" id="confirmCheckIcon"></div>
    <h2 class="display" style="font-size:1.3rem; margin:0;">Order Placed</h2>
    <p style="color:var(--muted); margin-top:8px;">Your vendor is preparing it now.</p>
    <div class="order-id-box">
      <p style="font-size:0.75rem; color:var(--muted); margin:0 0 4px; font-weight:700;">ORDER NUMBER</p>
      <p class="display" style="font-size:1.5rem; color:var(--gold); margin:0;" id="confirmOrderId"></p>
    </div>
    <div id="confirmSummary" style="width:100%;"></div>
    <div id="confirmRider" style="width:100%;"></div>
    <div class="delivery-note" style="text-align:left; margin-top:16px;">
      <span id="confirmMotoIcon"></span>
      <div>
        <p class="dn-title">Your rider will call to confirm the delivery fee</p>
        <p class="dn-body">Tonninyira doesn't set this — it depends on distance from the vendor to your door.</p>
      </div>
    </div>
  </div>
  <div style="padding:16px;"><button class="btn-primary" onclick="resetApp()">Back to Tonninyira</button></div>
</div>

<script>
const ICONS = {
  search: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
  cart: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>`,
  pin: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
  star: `<svg class="icon star" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
  moto: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="18" r="3"/><circle cx="19" cy="18" r="3"/><path d="M5 18h9l3-6h3M14 12l-2-5H8l-2 5"/></svg>`,
  home: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5l9-7 9 7V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>`,
  receipt: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="9" y1="12" x2="15" y2="12"/></svg>`,
  user: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  phone: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>`,
  emptyCart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>`,
  box: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>`,
};
document.getElementById('cartIconSvg').innerHTML = ICONS.cart;
document.getElementById('pinIconSvg').innerHTML = ICONS.pin;
document.getElementById('searchIconSvg').innerHTML = ICONS.search;
document.getElementById('navHomeIcon').innerHTML = ICONS.home;
document.getElementById('navOrdersIcon').innerHTML = ICONS.receipt;
document.getElementById('navCartIcon').innerHTML = ICONS.cart;
document.getElementById('navProfileIcon').innerHTML = ICONS.user;
document.getElementById('confirmCheckIcon').innerHTML = ICONS.check;
document.getElementById('confirmMotoIcon').innerHTML = ICONS.moto;
document.getElementById('brandBadge').innerHTML = `
  <svg viewBox="0 0 200 200" width="30" height="30">
    <path d="M30,138 Q66,182 102,138 Z" fill="#F5B400"/>
    <ellipse cx="66" cy="138" rx="34" ry="9" fill="#C98F00"/>
    <g transform="rotate(-10 148 70)">
      <ellipse cx="148" cy="58" rx="24" ry="32" fill="#E23F25"/>
      <ellipse cx="134" cy="112" rx="18" ry="24" fill="#E23F25"/>
      <ellipse cx="128" cy="24" rx="6.5" ry="8.5" fill="#E23F25"/>
      <ellipse cx="144" cy="18" rx="7" ry="9" fill="#E23F25"/>
      <ellipse cx="160" cy="22" rx="6" ry="8" fill="#E23F25"/>
      <ellipse cx="172" cy="32" rx="5.5" ry="7" fill="#E23F25"/>
    </g>
  </svg>`;

const CATALOG = {
  eats: { label:"Eats", subs: {
    breakfast: { label:"Breakfast", vendors:[
      { id:"v1", name:"Mama Rose's Corner", location:"Kisugu", rating:4.8, reviews:342, years:8, items:[

const AVATAR_COLORS = ['#E23F25','#F5B400','#4C9A5B','#C98F00','#B92E18'];

function initials(name){
  const words = name.replace(/'s\b/i,'').split(' ').filter(w=>w.length>1);
  return ((words[0]||'')[0]||'') + ((words[1]||'')[0]||'');
}
function avatarColor(name){
  let hash=0; for(let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash<<5)-hash);
  return AVATAR_COLORS[Math.abs(hash)%AVATAR_COLORS.length];
}
function fmt(n){ return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,','); }

function findVendor(vendorId){
  for(const catKey in CATALOG){
    for(const subKey in CATALOG[catKey].subs){
      const v = CATALOG[catKey].subs[subKey].vendors.find(v=>v.id===vendorId);
      if(v) return v;
    }
  }
  return null;
}
function allVendorsFlat(){
  let flat=[];
  Object.entries(CATALOG).forEach(([catKey,cat])=>{
    Object.entries(cat.subs).forEach(([subKey,sub])=>{
      sub.vendors.forEach(v=>flat.push({...v, catKey, subKey}));
    });
  });
  return flat;
}
function stallNumberFor(vendorId){
  const idx = allVendorsFlat().findIndex(v=>v.id===vendorId);
  return idx>=0 ? idx+1 : '—';
}

function renderPopular(){

function renderSearchResults(){
  const el = document.getElementById('mainArea');
  const term = AppState.searchTerm.toLowerCase();
  let matches = [];
  Object.entries(CATALOG).forEach(([catKey,cat])=>{
    Object.entries(cat.subs).forEach(([subKey,sub])=>{
      sub.vendors.forEach(v=>{
        const vendorHit = v.name.toLowerCase().includes(term);
        const matchedItems = v.items.filter(i=>i.name.toLowerCase().includes(term) || vendorHit);
        if(matchedItems.length) matches.push({...v, items: vendorHit ? v.items : matchedItems, catKey, subKey});
      });
    });
  });
  if(!matches.length){
    el.innerHTML = `<div class="empty-state">${ICONS.search}<p style="font-weight:700; color:var(--sand);">Nothing matches "${AppState.searchTerm}"</p><p>Try a different word, like a vendor name or a dish.</p></div>`;
    return;
  }
  el.innerHTML = `<div class="stall-list">${matches.map(v=>vendorCardHTML(v)).join('')}</div>`;
}

function vendorCardHTML(v){
  const stallNo = stallNumberFor(v.id);
  const showUNBS = v.catKey==='eats' || v.subKey==='groceries' || v.subKey==='rawfoods';
  const avatarOrLogo = v.logo
    ? `<img src="${v.logo}" class="avatar" onerror="this.outerHTML='<div class=&quot;avatar&quot; style=&quot;background:${avatarColor(v.name)}&quot;>${initials(v.name)}</div>'">`
    : `<div class="avatar" style="background:${avatarColor(v.name)};">${initials(v.name)}</div>`;
  const galleryHTML = (v.gallery && v.gallery.length) ? `
    <div class="gallery-strip">
      ${v.gallery.map(g=>`
        <div class="gallery-item">
          ${g.type==='video'
            ? `<video src="${g.url}" muted loop playsinline onmouseover="this.play()" onmouseout="this.pause()"></video>`
            : `<img src="${g.url}" loading="lazy">`}
          ${g.caption ? `<div class="gallery-caption">${g.caption}</div>` : ''}
        </div>`).join('')}
    </div>` : '';

  return `
    <div class="stall-card" id="vendor-${v.id}">
      <div class="stall-roof"></div>
      <div class="stall-header">
        ${avatarOrLogo}
        <div>
          <div class="stall-eyebrow">STALL NO. ${stallNo}</div>
          <div class="stall-name">${v.name}</div>
          <div class="stall-meta">
            ${ICONS.pin} ${v.location} &nbsp;·&nbsp; ${ICONS.star}${v.rating} (${v.reviews}) &nbsp;·&nbsp; ${v.years} yrs on Tonninyira
          </div>
          <div class="verify-row">
            ${ICONS.check} KCCA Licensed &nbsp;·&nbsp; ${ICONS.check} URA Registered
            ${showUNBS ? '&nbsp;·&nbsp; '+ICONS.check+' UNBS Certified' : ''}
          </div>
        </div>
      </div>
      ${galleryHTML}
      ${v.items.map(item=>`
        <div class="item-row">
          <div>
            <div class="item-name">${item.name}</div>
            <div class="item-desc">${item.desc}</div>
          </div>
          <div class="item-action">
            <span class="price-tag">${fmt(item.price)}</span>
            <button class="add-btn" onclick="addToCart('${v.id}','${item.id}')">+</button>
          </div>
        </div>`).join('')}
    </div>`;
}

function addToCart(vendorId, itemId){
  const vendor = findVendor(vendorId);
  const item = vendor.items.find(i=>i.id===itemId);
  const existing = AppState.cart.find(c=>c.vendorId===vendorId && c.itemId===itemId);
  if(existing) existing.qty++;
  else AppState.cart.push({vendorId, itemId, qty:1, name:item.name, price:item.price, vendorName:vendor.name});
  updateCartUI();
}
function updateQty(vendorId, itemId, delta){
  const line = AppState.cart.find(c=>c.vendorId===vendorId && c.itemId===itemId);
  if(!line) return;
  line.qty += delta;
  if(line.qty<=0) AppState.cart = AppState.cart.filter(c=>!(c.vendorId===vendorId && c.itemId===itemId));
  updateCartUI();
}
function cartSubtotal(){ return AppState.cart.reduce((s,c)=>s+c.price*c.qty,0); }
function cartCount(){ return AppState.cart.reduce((s,c)=>s+c.qty,0); }

      </div>

    </div>`;

  document.getElementById('confirmOverlay').classList.remove('hidden');
  document.getElementById('confirmSheet').classList.remove('hidden');

  try{
    await supabaseClient.from('orders').insert({
      order_id: orderId, items: AppState.cart, subtotal, payment_method: method,
      area: document.getElementById('areaSelect').value, rider_tid: rider.tid, created_at: new Date().toISOString(),

  AppState.cart = [];
  updateCartUI();
}

/* Pulls real registered stalls (with their own logo/gallery/items) from the
   'vendors' table your admin console writes to. Silently does nothing if
   Supabase isn't configured yet or the table is empty. */
async function loadLiveVendors(){
  try{
    const {data, error} = await supabaseClient.from('vendors').select('*');
    if(error || !data || !data.length) return;
    data.forEach((rv, idx)=>{
      const catKey = rv.category, subKey = rv.subcategory;
      if(!CATALOG[catKey] || !CATALOG[catKey].subs[subKey]) return;
      const items = (rv.items||[]).map((it,i)=>({...it, id:(rv.tonninyira_id||'live'+idx)+'-i'+i}));
      if(!items.length) return;
      CATALOG[catKey].subs[subKey].vendors.push({
        id: rv.tonninyira_id || ('live-'+idx),
        name: rv.business_name, location: rv.location||'',
        rating: rv.rating||4.5, reviews: rv.reviews||0, years: rv.years||0,
        logo: rv.logo_url||null, gallery: rv.gallery||[], items,
      });
    });
    renderAll();
  }catch(e){ console.log('Live vendor data unavailable yet:', e.message); }
}
async function loadLiveRiders(){
  try{
    /* Queries riders_public (a view with no national_id/phone columns) --
       never the raw riders table -- see the SQL note in the admin console. */
    const {data, error} = await supabaseClient.from('riders_public').select('*');
    if(error || !data || !data.length) return;
    data.forEach(r=>{
      const parts = (r.full_name||'Rider').split(' ');
      SAMPLE_RIDERS.push({
        tid: r.tonninyira_id, name: parts[0] + (parts[1] ? ' '+parts[1][0]+'.' : ''),
        vehicle: (r.vehicle_type||'Boda-boda') + ' · ' + (r.plate_number||''), rating: r.rating||4.8,
      });
    });
  }catch(e){ console.log('Live rider data unavailable yet:', e.message); }
}

function renderAll(){ renderCatTabs(); renderSubcatChips(); renderPopular(); renderMain(); }
renderAll();
updateCartUI();
loadLiveVendors();
loadLiveRiders();
</script>
</body>
