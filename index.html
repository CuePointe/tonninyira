<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tonninyira - Order Food & Market Items</title>
  <link href="https://cdn.tailwindcss.com" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary-red: #DC2626;
      --primary-yellow: #FBBF24;
      --dark-red: #991B1B;
      --light-yellow: #FEF3C7;
    }

    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #FEF3C7 0%, #FFFFFF 100%);
    }

    .header-red {
      background: linear-gradient(135deg, var(--primary-red) 0%, var(--dark-red) 100%);
    }

    .btn-red {
      background: var(--primary-red);
      color: white;
      transition: all 0.3s ease;
    }

    .btn-red:hover {
      background: var(--dark-red);
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(220, 38, 38, 0.3);
    }

    .btn-yellow {
      background: var(--primary-yellow);
      color: var(--dark-red);
      font-weight: 700;
      transition: all 0.3s ease;
    }

    .btn-yellow:hover {
      background: #F59E0B;
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(251, 191, 36, 0.4);
    }

    .product-card {
      border: 3px solid transparent;
      background: white;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .product-card:hover {
      border-color: var(--primary-red);
      transform: translateY(-6px);
      box-shadow: 0 12px 24px rgba(220, 38, 38, 0.2);
    }

    .icon-large {
      font-size: 4rem;
      line-height: 1;
    }

    .cart-badge {
      background: var(--primary-red);
      color: white;
      border-radius: 50%;
      min-width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.875rem;
    }

    .floating-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 40;
      border-radius: 50%;
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
      font-size: 2.5rem;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .zone-tab {
      padding: 12px 20px;
      font-size: 1.125rem;
      font-weight: 700;
      border: 3px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .zone-tab.active {
      background: var(--primary-red);
      color: white;
      border-color: var(--primary-red);
    }

    .zone-tab:not(.active) {
      background: white;
      color: var(--primary-red);
      border-color: var(--primary-yellow);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 40;
    }

    .modal-panel {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .cart-item-card {
      background: white;
      border-left: 4px solid var(--primary-red);
      padding: 16px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .quantity-btn {
      background: var(--light-yellow);
      border: 2px solid var(--primary-red);
      color: var(--primary-red);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: 700;
      font-size: 1.25rem;
      transition: all 0.2s ease;
    }

    .quantity-btn:hover {
      background: var(--primary-red);
      color: white;
    }

    .area-select {
      width: 100%;
      padding: 14px;
      border: 2px solid var(--primary-yellow);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--primary-red);
      background: white;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: #9CA3AF;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header-red text-white sticky top-0 z-40 shadow-2xl">
    <div class="px-4 py-4">
      <div class="flex items-center justify-between mb-4">
        <h1 class="text-3xl font-black">🍗 TONNINYIRA</h1>
        <button id="cartBtn" class="relative bg-white bg-opacity-20 px-3 py-2 rounded-lg">
          🛒
          <span id="cartCount" class="cart-badge absolute -top-2 -right-2">0</span>
        </button>
      </div>
      <p class="text-base font-bold text-yellow-200 mb-4">📦 Food & Market Stuff Fast!</p>
      <div>
        <label class="text-sm font-bold text-yellow-200 block mb-2">📍 Where Are You?</label>
        <select id="areaSelect" class="area-select">
          <option value="kisugu">Kisugu - 1,000 UGX</option>
          <option value="kansanga">Kansanga - 1,000 UGX</option>
          <option value="ggaba">Ggaba - 1,500 UGX</option>
          <option value="namwongo">Namwongo - 1,000 UGX</option>
          <option value="entebbe">Entebbe - 3,000 UGX</option>
          <option value="kasangati">Kasangati - 3,000 UGX</option>
          <option value="jinja">Jinja - 5,000 UGX</option>
        </select>
      </div>
    </div>
  </header>

  <!-- ZONE TABS -->
  <div class="sticky top-24 z-30 bg-white shadow-md px-4 py-4 border-b-4 border-yellow-300">
    <div class="flex gap-2 overflow-x-auto pb-2">
      <button class="zone-tab active" data-zone="meals">🍽️ MEALS</button>
      <button class="zone-tab" data-zone="snacks">🍔 SNACKS</button>
      <button class="zone-tab" data-zone="stuff">🛍️ STUFF</button>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <main class="pb-32 px-4">
    <section id="mealsZone" class="zone-content active py-4">
      <h2 class="text-2xl font-black text-red-700 mb-4">🍲 READY TO EAT</h2>
      <div id="mealsGrid" class="grid grid-cols-2 gap-4"></div>
    </section>

    <section id="snacksZone" class="zone-content hidden py-4">
      <h2 class="text-2xl font-black text-red-700 mb-4">🍩 QUICK BITES</h2>
      <div id="snacksGrid" class="grid grid-cols-2 gap-4"></div>
    </section>

    <section id="stuffZone" class="zone-content hidden py-4">
      <h2 class="text-2xl font-black text-red-700 mb-4">🛒 SHOP THINGS</h2>
      <div id="stuffGrid" class="grid grid-cols-2 gap-4"></div>
    </section>
  </main>

  <!-- FLOATING CART BUTTON -->
  <button id="floatingCartBtn" class="floating-btn btn-red hidden">🛒</button>

  <!-- CART PANEL -->
  <div id="cartOverlay" class="overlay hidden"></div>
  <div id="cartPanel" class="modal-panel hidden">
    <div class="header-red text-white p-6 flex justify-between items-center">
      <h2 class="text-2xl font-black">🛒 YOUR BASKET</h2>
      <button id="closeCartBtn" class="text-4xl font-black">✕</button>
    </div>

    <div id="cartItemsList" class="flex-1 overflow-y-auto p-4 space-y-4">
      <div class="empty-state">
        <div class="text-5xl mb-2">🛒</div>
        <p class="text-lg font-bold">Empty basket</p>
      </div>
    </div>

    <div class="border-t-4 border-yellow-300 p-6 space-y-4">
      <h3 class="text-lg font-black text-red-700">⚡ SPEED</h3>
      <label class="flex items-center gap-3 p-3 border-2 border-orange-300 rounded-lg cursor-pointer bg-yellow-50">
        <input type="radio" name="deliveryOption" value="standard" checked onchange="updateDelivery()">
        <div>
          <p class="font-black text-gray-900">Normal - 30-45 min</p>
          <p id="standardFeeDisplay" class="text-sm font-bold text-red-600">+1,000 UGX</p>
        </div>
      </label>
      <label class="flex items-center gap-3 p-3 border-2 border-gray-200 rounded-lg cursor-pointer">
        <input type="radio" name="deliveryOption" value="express" onchange="updateDelivery()">
        <div>
          <p class="font-black text-gray-900">FAST - 15-20 min</p>
          <p class="text-sm font-bold text-red-600">+3,000 UGX</p>
        </div>
      </label>
    </div>

    <div class="border-t-4 border-yellow-300 p-6 bg-yellow-50">
      <h3 class="text-lg font-black text-red-700 mb-4">📊 TOTAL</h3>
      <div class="space-y-3">
        <div class="flex justify-between font-black">
          <span>Items:</span>
          <span id="summaryItems">UGX 0</span>
        </div>
        <div class="flex justify-between font-black">
          <span>Delivery:</span>
          <span id="summaryDelivery">UGX 0</span>
        </div>
        <div class="flex justify-between font-black text-lg border-t-4 border-b-4 border-yellow-300 py-3 text-red-700">
          <span>YOU PAY:</span>
          <span id="summaryTotal">UGX 0</span>
        </div>
      </div>
    </div>

    <div class="border-t-4 border-yellow-300 p-6 space-y-3">
      <button id="checkoutBtn" class="btn-red w-full py-4 rounded-xl text-2xl font-black">✅ PAY NOW</button>
      <button id="continueShoppingBtn" class="btn-yellow w-full py-3 rounded-xl text-lg font-black">← KEEP SHOPPING</button>
    </div>
  </div>

  <!-- PAYMENT MODAL -->
  <div id="paymentOverlay" class="overlay hidden"></div>
  <div id="paymentModal" class="modal-panel hidden">
    <div class="header-red text-white p-6">
      <h2 class="text-2xl font-black">💳 HOW TO PAY</h2>
    </div>
    <div class="flex-1 p-6 space-y-4 overflow-y-auto">
      <button class="payment-option w-full" data-method="mtn">
        <div class="p-6 bg-yellow-50 rounded-xl border-4 border-yellow-300 text-center">
          <div class="text-4xl mb-2">📱</div>
          <p class="font-black text-lg text-gray-900">MTN MoMo</p>
        </div>
      </button>
      <button class="payment-option w-full" data-method="airtel">
        <div class="p-6 bg-red-50 rounded-xl border-4 border-red-300 text-center">
          <div class="text-4xl mb-2">📱</div>
          <p class="font-black text-lg text-gray-900">Airtel Money</p>
        </div>
      </button>
      <button class="payment-option w-full" data-method="cash">
        <div class="p-6 bg-green-50 rounded-xl border-4 border-green-300 text-center">
          <div class="text-4xl mb-2">💵</div>
          <p class="font-black text-lg text-gray-900">Cash on Delivery</p>
        </div>
      </button>
    </div>
    <div class="border-t-4 border-yellow-300 p-6">
      <button id="closePaymentBtn" class="btn-yellow w-full py-3 rounded-xl text-lg font-black">✕ CANCEL</button>
    </div>
  </div>

  <!-- CONFIRMATION MODAL -->
  <div id="confirmationOverlay" class="overlay hidden"></div>
  <div id="confirmationModal" class="modal-panel hidden">
    <div class="flex-1 flex flex-col items-center justify-center p-6 bg-gradient-to-b from-green-50 to-white">
      <div class="text-8xl mb-4">✅</div>
      <h2 class="text-3xl font-black text-green-700 mb-2">YES! DONE!</h2>
      <p class="text-lg text-gray-700 mb-6">Your food is being made 👨‍🍳</p>
      <div class="bg-yellow-50 rounded-xl border-4 border-yellow-300 p-6 w-full mb-6">
        <p class="text-sm text-gray-600 font-bold mb-1">Order:</p>
        <p id="confirmationOrderId" class="text-3xl font-black text-red-700 text-center">ORD-12345</p>
      </div>
      <div id="confirmationSummary" class="w-full mb-6"></div>
      <p class="text-center text-sm text-gray-600 mb-6">🚴 Driver coming in ~30 minutes</p>
    </div>
    <div class="border-t-4 border-yellow-300 p-6">
      <button id="confirmationCloseBtn" class="btn-red w-full py-4 rounded-xl text-xl font-black">🏠 BACK HOME</button>
    </div>
  </div>

  <script>
    // STATE
    const AppState = {
      cart: [],
      selectedZone: 'meals',
      selectedArea: 'kisugu',
      deliveryOption: 'standard',
      
      deliveryFees: {
        kisugu: 1000, kansanga: 1000, ggaba: 1500, namwongo: 1000,
        entebbe: 3000, kasangati: 3000, jinja: 5000,
      },

      products: {
        meals: [
          { id: 'm1', name: 'Rice & Stew', desc: 'With meat', price: 4000, icon: '🍚' },
          { id: 'm2', name: 'Posho & Beans', desc: 'Hot meal', price: 3500, icon: '🍲' },
          { id: 'm3', name: 'Fried Chicken', desc: '5-6 pieces', price: 5000, icon: '🍗' },
          { id: 'm4', name: 'Chapati & Curry', desc: '2 chapatis', price: 3500, icon: '🫓' },
          { id: 'm5', name: 'Chicken Soup', desc: 'With rice', price: 4500, icon: '🍲' },
          { id: 'm6', name: 'Matoke & Fish', desc: 'Steamed', price: 6000, icon: '🍌' },
          { id: 'm7', name: 'Beef Skewers', desc: '3-4 sticks', price: 5500, icon: '🍢' },
          { id: 'm8', name: 'Ugali & Veg', desc: 'With sukuma', price: 3000, icon: '🥔' },
        ],
        snacks: [
          { id: 's1', name: 'Rolex', desc: 'Egg in chapati', price: 2000, icon: '🌯' },
          { id: 's2', name: 'Mandazi Pack', desc: '6 pieces', price: 2000, icon: '🍩' },
          { id: 's3', name: 'Beans on Toast', desc: 'With toast', price: 2500, icon: '🍞' },
          { id: 's4', name: 'Samosa Pack', desc: '5 pieces', price: 2500, icon: '🥟' },
          { id: 's5', name: 'Spring Rolls', desc: '4 pieces', price: 3000, icon: '🥠' },
          { id: 's6', name: 'Doughnut Pack', desc: '5 pieces', price: 2500, icon: '🍩' },
        ],
        stuff: [
          { id: 't1', name: 'Fresh Posho', desc: '1kg', price: 3500, icon: '🌽' },
          { id: 't2', name: 'Dry Beans', desc: '2kg', price: 6000, icon: '🫘' },
          { id: 't3', name: 'Tomatoes', desc: 'Heap', price: 4000, icon: '🍅' },
          { id: 't4', name: 'Cooking Oil', desc: '1L', price: 5000, icon: '🫗' },
          { id: 't5', name: 'Eggs (15)', desc: 'Fresh', price: 7000, icon: '🥚' },
          { id: 't6', name: 'Sugar', desc: '500g', price: 3000, icon: '🍬' },
          { id: 't7', name: 'Denim Jeans', desc: 'Good quality', price: 7500, icon: '👖' },
          { id: 't8', name: 'Sports Shoes', desc: 'Good condition', price: 10000, icon: '👟' },
        ],
      },
    };

    // DOM
    const DOM = {
      areaSelect: document.getElementById('areaSelect'),
      cartBtn: document.getElementById('cartBtn'),
      cartCount: document.getElementById('cartCount'),
      zoneTabs: document.querySelectorAll('.zone-tab'),
      zoneContents: document.querySelectorAll('.zone-content'),
      mealsGrid: document.getElementById('mealsGrid'),
      snacksGrid: document.getElementById('snacksGrid'),
      stuffGrid: document.getElementById('stuffGrid'),
      cartPanel: document.getElementById('cartPanel'),
      cartOverlay: document.getElementById('cartOverlay'),
      closeCartBtn: document.getElementById('closeCartBtn'),
      cartItemsList: document.getElementById('cartItemsList'),
      floatingCartBtn: document.getElementById('floatingCartBtn'),
      summaryItems: document.getElementById('summaryItems'),
      summaryDelivery: document.getElementById('summaryDelivery'),
      summaryTotal: document.getElementById('summaryTotal'),
      standardFeeDisplay: document.getElementById('standardFeeDisplay'),
      checkoutBtn: document.getElementById('checkoutBtn'),
      continueShoppingBtn: document.getElementById('continueShoppingBtn'),
      paymentModal: document.getElementById('paymentModal'),
      paymentOverlay: document.getElementById('paymentOverlay'),
      closePaymentBtn: document.getElementById('closePaymentBtn'),
      paymentOptions: document.querySelectorAll('.payment-option'),
      confirmationModal: document.getElementById('confirmationModal'),
      confirmationOverlay: document.getElementById('confirmationOverlay'),
      confirmationOrderId: document.getElementById('confirmationOrderId'),
      confirmationSummary: document.getElementById('confirmationSummary'),
      confirmationCloseBtn: document.getElementById('confirmationCloseBtn'),
    };

    // INIT
    function init() {
      renderProducts();
      setupEvents();
      updateDisplay();
    }

    // RENDER PRODUCTS
    function renderProducts() {
      ['meals', 'snacks', 'stuff'].forEach(zone => {
        const grid = zone === 'meals' ? DOM.mealsGrid : zone === 'snacks' ? DOM.snacksGrid : DOM.stuffGrid;
        grid.innerHTML = AppState.products[zone].map(p => `
          <div class="product-card rounded-xl shadow-md p-4 flex flex-col items-center text-center">
            <div class="icon-large mb-3">${p.icon}</div>
            <h3 class="font-black text-base text-gray-900 mb-1">${p.name}</h3>
            <p class="text-xs text-gray-600 mb-3">${p.desc}</p>
            <p class="text-2xl font-black text-red-700 mb-3">UGX ${fmt(p.price)}</p>
            <button onclick="addCart('${p.id}', '${zone}')" class="btn-red w-full py-2 rounded-lg font-black text-sm">+ ADD</button>
          </div>
        `).join('');
      });
    }

    // ADD TO CART
    function addCart(id, zone) {
      const prod = AppState.products[zone].find(p => p.id === id);
      const existing = AppState.cart.find(item => item.id === id);
      if (existing) existing.qty++;
      else AppState.cart.push({...prod, qty: 1});
      updateDisplay();
    }

    // UPDATE QUANTITY
    function updateQty(id, delta) {
      const item = AppState.cart.find(item => item.id === id);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) AppState.cart = AppState.cart.filter(i => i.id !== id);
        updateDisplay();
      }
    }

    // UPDATE DELIVERY
    function updateDelivery() {
      AppState.deliveryOption = document.querySelector('input[name="deliveryOption"]:checked').value;
      updateDisplay();
    }

    // FORMAT PRICE
    function fmt(n) {
      return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    // GET DELIVERY FEE
    function getDeliveryFee() {
      const base = AppState.deliveryFees[AppState.selectedArea] || 1000;
      const express = AppState.deliveryOption === 'express' ? 2000 : 0;
      return base + express;
    }

    // UPDATE DISPLAY
    function updateDisplay() {
      const total = AppState.cart.reduce((s, i) => s + i.price * i.qty, 0);
      const delivery = getDeliveryFee();
      const grandTotal = total + delivery;

      DOM.cartCount.textContent = AppState.cart.length;
      DOM.standardFeeDisplay.textContent = `+${fmt(AppState.deliveryFees[AppState.selectedArea])} UGX`;

      if (AppState.cart.length === 0) {
        DOM.cartItemsList.innerHTML = '<div class="empty-state"><div class="text-5xl mb-2">🛒</div><p class="text-lg font-bold">Empty basket</p></div>';
        DOM.summaryItems.textContent = 'UGX 0';
        DOM.summaryDelivery.textContent = 'UGX 0';
        DOM.summaryTotal.textContent = 'UGX 0';
        DOM.floatingCartBtn.classList.add('hidden');
        return;
      }

      DOM.cartItemsList.innerHTML = AppState.cart.map(i => `
        <div class="cart-item-card">
          <div>
            <p class="font-black text-lg">${i.icon} ${i.name}</p>
            <p class="text-sm text-gray-600">UGX ${fmt(i.price)} x ${i.qty}</p>
          </div>
          <div class="flex gap-2">
            <button class="quantity-btn" onclick="updateQty('${i.id}', -1)">−</button>
            <span class="font-black min-w-[2rem] text-center">${i.qty}</span>
            <button class="quantity-btn" onclick="updateQty('${i.id}', 1)">+</button>
          </div>
        </div>
      `).join('');

      DOM.summaryItems.textContent = `UGX ${fmt(total)}`;
      DOM.summaryDelivery.textContent = `UGX ${fmt(delivery)}`;
      DOM.summaryTotal.textContent = `UGX ${fmt(grandTotal)}`;
      DOM.floatingCartBtn.classList.remove('hidden');
    }

    // SETUP EVENTS
    function setupEvents() {
      DOM.zoneTabs.forEach(tab => {
        tab.addEventListener('click', () => {
          DOM.zoneTabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          DOM.zoneContents.forEach(c => c.classList.add('hidden'));
          document.getElementById(tab.dataset.zone + 'Zone').classList.remove('hidden');
        });
      });

      DOM.areaSelect.addEventListener('change', (e) => {
        AppState.selectedArea = e.target.value;
        updateDisplay();
      });

      DOM.cartBtn.addEventListener('click', openCart);
      DOM.floatingCartBtn.addEventListener('click', openCart);
      DOM.closeCartBtn.addEventListener('click', closeCart);
      DOM.continueShoppingBtn.addEventListener('click', closeCart);
      DOM.cartOverlay.addEventListener('click', closeCart);

      DOM.checkoutBtn.addEventListener('click', () => {
        if (AppState.cart.length === 0) return alert('Add items first!');
        closeCart();
        DOM.paymentModal.classList.remove('hidden');
        DOM.paymentOverlay.classList.remove('hidden');
      });

      DOM.closePaymentBtn.addEventListener('click', () => {
        DOM.paymentModal.classList.add('hidden');
        DOM.paymentOverlay.classList.add('hidden');
      });

      DOM.paymentOptions.forEach(btn => {
        btn.addEventListener('click', () => completeOrder(btn.dataset.method));
      });

      DOM.confirmationCloseBtn.addEventListener('click', () => {
        location.reload();
      });
    }

    function openCart() {
      DOM.cartPanel.classList.remove('hidden');
      DOM.cartOverlay.classList.remove('hidden');
    }

    function closeCart() {
      DOM.cartPanel.classList.add('hidden');
      DOM.cartOverlay.classList.add('hidden');
    }

    function completeOrder(method) {
      const orderId = 'ORD-' + Math.random().toString(36).substr(2, 9).toUpperCase();
      const total = AppState.cart.reduce((s, i) => s + i.price * i.qty, 0);
      const delivery = getDeliveryFee();
      const grandTotal = total + delivery;

      DOM.paymentModal.classList.add('hidden');
      DOM.paymentOverlay.classList.add('hidden');

      DOM.confirmationOrderId.textContent = orderId;
      DOM.confirmationSummary.innerHTML = `
        <div class="space-y-2">
          ${AppState.cart.map(i => `
            <div class="flex justify-between text-sm font-semibold">
              <span>${i.icon} ${i.name} x${i.qty}</span>
              <span>UGX ${fmt(i.price * i.qty)}</span>
            </div>
          `).join('')}
          <div class="border-t-2 border-gray-300 pt-2 flex justify-between font-black text-lg text-red-700">
            <span>TOTAL:</span>
            <span>UGX ${fmt(grandTotal)}</span>
          </div>
        </div>
      `;

      DOM.confirmationModal.classList.remove('hidden');
      DOM.confirmationOverlay.classList.remove('hidden');

      AppState.cart = [];
      updateDisplay();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>

</body>
</html>
