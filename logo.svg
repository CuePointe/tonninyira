<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .word { font-family: 'Arial Black', Arial, sans-serif; font-weight: 900; }
      .tag  { font-family: Arial, sans-serif; font-weight: 700; }
      .meaning { font-family: Arial, sans-serif; font-style: italic; font-weight: 400; }
    </style>
  </defs>

  <!-- Background card -->
  <rect width="900" height="260" rx="28" fill="#1C1410"/>

  <!-- Ambient "string light" dots across the top -->
  <g opacity="0.55">
    <circle cx="60" cy="16" r="3" fill="#F5B400"/>
    <circle cx="100" cy="14" r="2.5" fill="#E23F25"/>
    <circle cx="140" cy="17" r="3" fill="#F5B400"/>
    <circle cx="180" cy="14" r="2.5" fill="#E23F25"/>
    <circle cx="220" cy="16" r="3" fill="#F5B400"/>
    <circle cx="500" cy="16" r="3" fill="#F5B400"/>
    <circle cx="540" cy="14" r="2.5" fill="#E23F25"/>
    <circle cx="580" cy="17" r="3" fill="#F5B400"/>
    <circle cx="620" cy="14" r="2.5" fill="#E23F25"/>
    <circle cx="660" cy="16" r="3" fill="#F5B400"/>
    <circle cx="700" cy="14" r="2.5" fill="#E23F25"/>
    <circle cx="740" cy="17" r="3" fill="#F5B400"/>
    <circle cx="780" cy="14" r="2.5" fill="#E23F25"/>
    <circle cx="820" cy="16" r="3" fill="#F5B400"/>
  </g>

  <!-- EMBLEM: a "T" built from a market-stall awning (scalloped bunting edge) + post -->
  <g transform="translate(40,30)">
    <rect width="200" height="200" rx="32" fill="#2A1F19"/>
    <!-- awning / roof of the T, scalloped bottom edge like market tarp bunting -->
    <path d="M40,50 L160,50 L160,64 L150,76 L140,64 L130,76 L120,64 L110,76
             L100,64 L90,76 L80,64 L70,76 L60,64 L50,76 L40,64 Z" fill="#F5B400"/>
    <!-- post of the T -->
    <rect x="88" y="76" width="24" height="104" rx="10" fill="#E23F25"/>
  </g>

  <!-- Wordmark -->
  <text x="278" y="112" class="word" font-size="62" letter-spacing="1" fill="#F3E8D8">TONNINYIRA</text>
  <text x="280" y="148" class="tag" font-size="21" letter-spacing="3" fill="#F5B400">LOCAL VENDORS · REAL PRICES · YOUR DOOR</text>
  <text x="280" y="182" class="meaning" font-size="16" fill="#9C897A">Luganda: "don't step on me" — the spirit of Kampala's markets</text>
</svg>
