<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tonninyira — Stall Dashboard</title>
<link rel="icon" href="assets/favicon-32.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#1c1410;--card:#2a1f19;--card2:#33261c;--sand:#f3e8d8;--gold:#f5b400;--red:#e23f25;--green:#4c9a5b;--muted:#9c897a}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--sand);font:15px system-ui,sans-serif}.wrap{max-width:700px;margin:auto;padding:20px}.card{background:var(--card2);padding:18px;border-radius:14px;margin:12px 0}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff14;padding-bottom:14px}.brand{font-weight:900;font-size:1.2rem}.muted{color:var(--muted);font-size:.85rem}label{display:block;margin:12px 0 5px;font-weight:700}input{width:100%;padding:12px;border-radius:10px;border:1px solid #ffffff22;background:var(--card);color:var(--sand)}button{padding:11px 14px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:var(--red);color:var(--sand);width:100%;margin-top:15px}.secondary{background:transparent;border:1px solid #ffffff22;color:var(--sand)}.error{color:#ff8b77;font-weight:700;margin-top:10px}.order{border-left:4px solid var(--gold);padding:14px;background:var(--card);border-radius:10px;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}.accept{background:var(--gold)}.ready{background:var(--green);color:white}.done{background:#4a3b31;color:white}.decline{background:transparent;border:1px solid var(--red);color:#ff806a}.hidden{display:none!important}
</style></head>
<body><div class="wrap">
<div class="top"><div><div class="brand">Tonninyira</div><div class="muted">Secure Stall Dashboard</div></div><a class="muted" href="index.html">← App</a></div>
<section id="loginView" class="card"><h2>Log in to your stall</h2><label for="phone">Phone number</label><input id="phone" type="tel" autocomplete="tel"><label for="pin">4-digit PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password"><button class="primary" id="loginBtn">Log In</button><div id="loginError" class="error hidden"></div><p class="muted">Only approved stalls can sign in. Authentication is handled server-side.</p></section>
<section id="dashView" class="hidden"><div class="card"><div class="top"><div><strong id="vendorName"></strong><div id="vendorId" class="muted"></div></div><button class="secondary" id="logoutBtn">Log out</button></div><p class="muted">Your access is controlled by Supabase Auth and database row-level security.</p><button class="secondary" id="refreshBtn">↻ Refresh orders</button></div><div id="orders"></div></section>
</div><script>
const SUPABASE_URL='https://alxzmjgepftohwpqibmn.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFseHptamdlcGZ0b2h3cHFpYm1uIiwiaWF0IjoxNzg1OTk4NTQ0LCJleHAiOjIxMDE1NzQ1NDR9.YvFQhCqL6spINPsyLs7lf7z5wxtnfi4U893ydWLXEaA';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let vendor=null;
const $=id=>document.getElementById(id);
function showLoginError(msg){$('loginError').textContent=msg;$('loginError').classList.remove('hidden')}
async function login(){
 $('loginError').classList.add('hidden'); const phone=$('phone').value.trim(),pin=$('pin').value.trim();
 if(!/^\d{4}$/.test(pin)||!phone){showLoginError('Enter your phone number and 4-digit PIN.');return}
 $('loginBtn').disabled=true;
 try{
  const {data,error}=await sb.functions.invoke('vendor-login',{body:{phone,pin}}); if(error||!data?.session) throw new Error(data?.error||error?.message||'Login failed');
  const {error:setError}=await sb.auth.setSession({access_token:data.session.access_token,refresh_token:data.session.refresh_token}); if(setError)throw setError;
  vendor=data.vendor; renderDashboard(); await loadOrders();
 }catch(e){showLoginError('Phone number or PIN is incorrect, or the stall is not approved.')}finally{$('loginBtn').disabled=false}
}
async function requireSession(){
 const {data}=await sb.auth.getSession(); if(!data.session){return false}
 const {data:p}=await sb.from('profiles').select('role,display_name,phone').eq('id',data.session.user.id).maybeSingle();
 if(!p||p.role!=='vendor'){await sb.auth.signOut();return false}
 const {data:v}=await sb.from('vendors').select('tonninyira_id,business_name,approval_status').eq('auth_user_id',data.session.user.id).eq('approval_status','approved').maybeSingle();
 if(!v){await sb.auth.signOut();return false} vendor=v;return true
}
function renderDashboard(){$('loginView').classList.add('hidden');$('dashView').classList.remove('hidden');$('vendorName').textContent=vendor.business_name;$('vendorId').textContent=vendor.tonninyira_id}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function itemLines(items){if(!Array.isArray(items))return '<div class="muted">Items unavailable</div>';return items.map(i=>`<div><b>${esc(i.name||'Item')}</b> × ${Number(i.qty||i.quantity||1)}</div>`).join('')}
async function loadOrders(){
 const {data,error}=await sb.from('orders').select('id,order_id,items,subtotal,delivery_fee,total,delivery_area,delivery_option,payment_method,status,created_at,customer_phone').order('created_at',{ascending:false}).limit(50);
 if(error){$('orders').innerHTML='<div class="card error">Could not load orders.</div>';return}
 $('orders').innerHTML=data?.length?data.map(o=>`<article class="order"><div><b>${esc(o.order_id||o.id)}</b> <span class="muted">${esc(o.status||'pending')}</span></div><div style="margin-top:8px">${itemLines(o.items)}</div><div class="muted">Total: UGX ${Number(o.total||0).toLocaleString()} · ${esc(o.delivery_area||'')}</div><div class="actions">${o.status==='pending'?`<button class="accept" onclick="setStatus('${esc(o.id)}','accepted')">Accept</button><button class="decline" onclick="setStatus('${esc(o.id)}','declined')">Decline</button>`:''}${o.status==='accepted'?`<button class="ready" onclick="setStatus('${esc(o.id)}','ready')">Mark ready</button>`:''}${o.status==='ready'?`<button class="done" onclick="setStatus('${esc(o.id)}','completed')">Complete</button>`:''}</div></article>`).join(''):'<div class="card muted">No orders yet.</div>';
}
async function setStatus(id,status){const allowed=['accepted','declined','ready','completed'];if(!allowed.includes(status))return;const {error}=await sb.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert('That order could not be updated.');else loadOrders()}
async function logout(){await sb.auth.signOut();vendor=null;$('dashView').classList.add('hidden');$('loginView').classList.remove('hidden')}
$('loginBtn').onclick=login;$('logoutBtn').onclick=logout;$('refreshBtn').onclick=loadOrders;
(async()=>{if(await requireSession()){renderDashboard();loadOrders()}})();
</script></body></html>
