<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tonninyira — Staff Console</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--ink:#1c1410;--card:#33261c;--sand:#f3e8d8;--gold:#f5b400;--red:#e23f25;--green:#4c9a5b;--muted:#9c897a}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--sand);font:15px system-ui,sans-serif}.wrap{max-width:850px;margin:auto;padding:20px}.card{background:var(--card);border-radius:14px;padding:18px;margin:12px 0}input{width:100%;padding:12px;background:#2a1f19;color:var(--sand);border:1px solid #ffffff22;border-radius:9px;margin:7px 0 12px}button{padding:11px 14px;border:0;border-radius:9px;font-weight:800;cursor:pointer}.primary{background:var(--red);color:white}.approve{background:var(--green);color:white}.reject{background:#6b3028;color:white}.muted{color:var(--muted);font-size:.85rem}.error{color:#ff8b77;font-weight:700}.hidden{display:none!important}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #ffffff12;padding:13px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}</style></head><body><main class="wrap"><div class="card"><h1>Tonninyira Staff Console</h1><p class="muted">Access is enforced by Supabase Auth plus the profile role. Do not share this URL as a security mechanism.</p><section id="login"><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button class="primary" id="loginBtn">Sign in</button><p id="loginError" class="error hidden"></p></section><section id="console" class="hidden"><div class="row"><div><b id="who"></b><div id="role" class="muted"></div></div><button id="logout">Log out</button></div><h2>Pending applications</h2><div id="list">Loading…</div></section></div></main><script>
const URL='https://alxzmjgepftohwpqibmn.supabase.co';const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFseHptamdlcGZ0b2h3cHFpYm1uIiwiaWF0IjoxNzg1OTk4NTQ0LCJleHAiOjIxMDE1NzQ1NDR9.YvFQhCqL6spINPsyLs7lf7z5wxtnfi4U893ydWLXEaA';const sb=window.supabase.createClient(URL,KEY);const $=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function boot(){const {data}=await sb.auth.getSession();if(!data.session)return;const {data:p}=await sb.from('profiles').select('role,display_name').eq('id',data.session.user.id).maybeSingle();if(!p||!['staff','admin'].includes(p.role)){await sb.auth.signOut();return showError('This account is not authorized for the staff console.')}$('login').classList.add('hidden');$('console').classList.remove('hidden');$('who').textContent=p.display_name||data.session.user.email;$('role').textContent=p.role;load();}
function showError(m){$('loginError').textContent=m;$('loginError').classList.remove('hidden')}
$('loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)showError('Sign-in failed.');else boot()};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function load(){const [v,r]=await Promise.all([sb.from('vendors').select('id,tonninyira_id,business_name,owner_name,phone,approval_status,created_at').eq('approval_status','pending').order('created_at',{ascending:false}),sb.from('riders').select('id,tonninyira_id,full_name,phone,vehicle_type,plate_number,approval_status,created_at').eq('approval_status','pending').order('created_at',{ascending:false})]);if(v.error||r.error){$('list').innerHTML='<p class="error">Could not load applications. Check RLS policies.</p>';return}const vendors=v.data||[],riders=r.data||[];$('list').innerHTML=(vendors.length?'<h3>Stalls</h3>'+vendors.map(x=>`<div class="row"><div><b>${esc(x.business_name)}</b><div class="muted">${esc(x.owner_name)} · ${esc(x.phone)} · ${esc(x.tonninyira_id)}</div></div><div class="actions"><button class="approve" onclick="decide('vendors','${esc(x.id)}','approved')">Approve</button><button class="reject" onclick="decide('vendors','${esc(x.id)}','rejected')">Reject</button></div></div>`).join(''):'<p class="muted">No pending stalls.</p>')+(riders.length?'<h3>Riders</h3>'+riders.map(x=>`<div class="row"><div><b>${esc(x.full_name)}</b><div class="muted">${esc(x.phone)} · ${esc(x.vehicle_type)} · ${esc(x.plate_number)} · ${esc(x.tonninyira_id)}</div></div><div class="actions"><button class="approve" onclick="decide('riders','${esc(x.id)}','approved')">Approve</button><button class="reject" onclick="decide('riders','${esc(x.id)}','rejected')">Reject</button></div></div>`).join(''):'<p class="muted">No pending riders.</p>')}
async function decide(table,id,status){const {error}=await sb.from(table).update({approval_status:status}).eq('id',id);if(error)alert('Not authorized or update failed.');else load()}boot();
</script></body></html>
